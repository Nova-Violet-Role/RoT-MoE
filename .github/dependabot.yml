#
# Real dependency updates. Every PR Dependabot opens here is a genuine version
# bump that the CI in verify.yml must re-prove before it can merge -- so repo
# activity and repo correctness are the same signal, not two.
#
# Dependabot has no Lean/Lake ecosystem, so mathlib's pin is NOT managed here.
# It is bumped by verify.yml's scheduled run, which rebuilds against the pinned
# toolchain and reports honestly when a newer one breaks a proof.
#
# NOR does Dependabot update the shared `Lean Theorem/` corpus, and it was asked
# to. It cannot: Dependabot updates DECLARED DEPENDENCIES in ecosystems it knows,
# it cannot watch a folder of proofs, and it cannot reinstall a Claude Code
# plugin. There is also no `--force-update` flag to give it -- measured against
# Claude Code 2.1.227 on 2026-08-14, `claude plugin update` accepts only
# `-h` and `-s/--scope`.
#
# The corpus is therefore handled where it CAN be handled, and deliberately
# decoupled from the release cadence so that a contributed theorem never requires
# a new plugin version:
#
#   SETUP_CORPUS.sh / .ps1              fetch or refresh on demand (`/corpus`)
#   .github/workflows/corpus-update.yml re-prove it travels, on every corpus push

# CADENCE, measured against what Dependabot actually accepts:
# `schedule.interval` takes ONLY daily | weekly | monthly. There is no cron and
# no "three times a week" -- and Dependabot cannot be renamed or cloned into
# "Ads Manager" or "Hashtag Manager"; it is one GitHub-owned service with one
# job, updating dependencies.
#
# So the 3x-weekly cadence lives where it CAN live: the named workflows in
# .github/workflows/ (tag-manager.yml, ads-manager.yml), each on a Mon/Wed/Fri
# cron. `daily` below is Dependabot's fastest setting -- weekdays only, so about
# five runs a week, which covers the request and then some.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
