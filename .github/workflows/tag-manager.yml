# ---------------------------------------------------------------------------
# META HASHTAG MANAGER
#
# Runs Monday / Wednesday / Friday. It does ONE job and does it for real:
# .github/tags.txt is the single source of truth for the tag set, and this
# workflow DERIVES every other copy from it --
#
#   * the README signature block (visible #hashtag text, which is the form
#     MEASURED to survive GitHub's markdown sanitizer -- see topics.md)
#   * the GitHub repo topics, pushed through the API
#   * the CITATION.cff keywords list
#
# That is the [!SPEC] rule applied to a constant that is not a number: the tag
# list appeared in four places, so three of them were going to be wrong the
# first time one changed. Now one is authored and three are generated, and the
# workflow fails if any generated copy has been hand-edited.
#
# It commits ONLY on real drift. No --allow-empty anywhere: a run that finds
# everything already in sync says nothing, which is what an honest instrument
# does when there is nothing to report.
# ---------------------------------------------------------------------------

name: Meta Hashtag Manager

on:
  schedule:
    - cron: "0 7 * * 1,3,5"   # Mon / Wed / Fri, 07:00 UTC
  push:
    paths:
      - ".github/tags.txt"
  workflow_dispatch:

permissions:
  # `contents: write` only, and that is not an oversight.
  #
  # MEASURED 2026-08-01, twice. First: `PUT /repos/{owner}/{repo}/topics` with
  # this token returned `gh: Resource not accessible by integration (HTTP 403)`.
  # Then `administration: write` was added to fix it -- and the run failed with
  # ZERO JOBS, because `administration` IS NOT A VALID GITHUB_TOKEN PERMISSION.
  # The key is valid YAML and an invalid workflow, so GitHub refused the file
  # outright rather than reporting a bad key.
  #
  # The conclusion is stronger than the first failure suggested: this token
  # CANNOT be granted topic-write at all. Writing topics from a workflow needs
  # a PAT. That is why the step below verifies before it repairs -- not as a
  # convenience, but because a green-on-no-drift run is the only honest
  # outcome available to a token that is not permitted to write.
  contents: write

concurrency:
  group: tag-manager
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --- validate the source of truth BEFORE deriving anything from it -----
      # An invalid tag set must fail loudly here rather than be pushed to the
      # topics API and half-applied.
      # TWO TIERS. The 20-cap is a GitHub server limit and applies ONLY to
      # [TOPICS]. [SIGNATURE] is visible README text and has no limit -- capping
      # it would throw away the one surface that has none.
      - name: Validate tags.txt
        run: |
          set -euo pipefail
          section () { awk -v s="[$1]" '$0==s{f=1;next} /^\[/{f=0} f' .github/tags.txt \
                       | grep -vE '^\s*(#|$)'; }
          section TOPICS    > /tmp/topics.txt
          section SIGNATURE > /tmp/signature.txt
          nt=$(wc -l < /tmp/topics.txt); ns=$(wc -l < /tmp/signature.txt)
          echo "topics: $nt (cap 20)   signature: $ns (no cap)"

          fail=0
          [ "$nt" -eq 0 ] && { echo "::error::no topics"; fail=1; }
          if [ "$nt" -gt 20 ]; then
            echo "::error::$nt topics -- GitHub's API rejects the 21st. Move the extras to [SIGNATURE]."
            fail=1
          fi
          # Syntax applies to both tiers; the CAP does not.
          while read -r t; do
            [ "${#t}" -gt 35 ] && { echo "::error::'$t' longer than 35 chars"; fail=1; }
            printf '%s' "$t" | grep -qE '^[a-z0-9][a-z0-9-]*$' \
              || { echo "::error::'$t' invalid (lowercase, [a-z0-9-], no leading hyphen)"; fail=1; }
          done < <(cat /tmp/topics.txt /tmp/signature.txt)
          for f in /tmp/topics.txt /tmp/signature.txt; do
            [ "$(sort "$f" | uniq -d | wc -l)" -gt 0 ] && { echo "::error::duplicates in $f"; fail=1; }
          done
          # The signature must be a SUPERSET of the topics -- otherwise a topic
          # someone searches for is missing from the indexed body text.
          if [ -n "$(comm -23 <(sort /tmp/topics.txt) <(sort /tmp/signature.txt))" ]; then
            echo "::error::a topic is missing from [SIGNATURE]:"
            comm -23 <(sort /tmp/topics.txt) <(sort /tmp/signature.txt)
            fail=1
          fi
          exit "$fail"

      # --- EVERY TAG MUST BE TRUE OF *THIS* REPOSITORY ----------------------
      # CORRECTED 2026-08-01, and the old version of this step is the reason the
      # correction was needed. It accepted "present in EITHER ACCOUNT" as
      # evidence -- so `python`, `c`, `compiler`, `rolling-context` and
      # `context-compression` passed it, because the owner writes Python and C
      # elsewhere, and they shipped on a repository that contains none of them.
      #
      # A topic is a claim about the repository that CARRIES it, never about its
      # author's other work. The account scan is gone: evidence is this tree,
      # its README and its plugin manifest. The authority on language tags is
      # checker/tags-consistency.sh phase 6, which is a GATE and decides
      # `git ls-files '*.py'` rather than warning about it.
      - name: Evidence check against THIS tree
        run: |
          set -euo pipefail
          : > /tmp/evidence.txt
          git ls-files >> /tmp/evidence.txt
          cat README.md .claude-plugin/plugin.json >> /tmp/evidence.txt 2>/dev/null || true
          tr 'A-Z' 'a-z' < /tmp/evidence.txt > /tmp/ev.lc

          missing=0
          while read -r t; do
            probe=$(printf '%s' "$t" | tr '-' ' ')
            head=${probe%% *}
            if ! grep -qF "$head" /tmp/ev.lc; then
              echo "::warning::no evidence found for tag '$t' (probe '$head')"
              missing=$((missing+1))
            fi
          done < /tmp/signature.txt
          echo "tags without direct evidence: $missing"
          # Reported, not fatal: "mixture-of-experts" is true of this repo's
          # SUBJECT without appearing as a filename. A hard failure here would
          # forbid correct tags, which is the defect this project calls a spec
          # that forbids a correct future.

      # --- NEGATIVE CONTROL for the evidence check --------------------------
      - name: Evidence check negative control
        run: |
          set -uo pipefail
          if grep -qF "kardashian" /tmp/ev.lc; then
            echo "::error::evidence set matches an obviously-absent term -- the check is decoration"
            exit 1
          fi
          echo "control: 'kardashian' correctly has no evidence -- the check can fail"

      # --- NEGATIVE CONTROL -------------------------------------------------
      # An instrument is guilty until proven able to fail. This feeds the
      # validator a deliberately invalid tag and requires it to reject it. If
      # this step passes, the validation above proved nothing and the job dies.
      - name: Validator negative control
        run: |
          set -uo pipefail
          bad=$(printf 'Not-A-Topic\n')
          if printf '%s' "$bad" | grep -qE '^[a-z0-9][a-z0-9-]*$'; then
            echo "::error::validator accepted 'Not-A-Topic' -- the check is decoration"
            exit 1
          fi
          echo "control rejected as required"

      - name: Derive every copy from tags.txt
        run: |
          set -euo pipefail
          mapfile -t TAGS < /tmp/signature.txt   # UNLIMITED tier

          # 1. README signature block. Visible text, never <meta>, never
          #    display:none -- measured: <meta> is deleted by GitHub's
          #    sanitizer and display:none renders visible anyway. This block
          #    carries the FULL signature list, not the 20 topics.
          # RENDERING, fixed 2026-08-01. The previous form emitted a bare
          # `**Topics** ·` followed by forty-odd `#CamelCase` words separated by
          # spaces. Markdown joins those source lines into ONE paragraph, so the
          # foot of the README became an unbroken wall of hashtags -- and since
          # `#word` is not a CommonMark heading and not a GitHub cross-reference,
          # it is not even clickable. Forty-two words of grey noise under the
          # licence block, which is what "not rendering good" meant.
          #
          # Now: a <details> element, collapsed by default, with each tag as an
          # inline code chip. GitHub renders those as discrete pills; the wall
          # costs one line until someone opens it. The `#Name` spelling is kept
          # INSIDE the backticks because checker/tags-consistency.sh extracts
          # the block with `grep -o '#[A-Za-z0-9]*'` and diffs it against
          # tags.txt as a set -- changing the spelling would break that gate,
          # and a cosmetic change must not cost a real check.
          #
          # Topics are repo METADATA and GitHub already renders them at the top
          # of the page; this block exists for the unlimited tier, which the
          # 20-topic cap cannot carry. It is a supplement, not the primary
          # surface, and it now looks like one.
          {
            echo "<!-- TAGS:BEGIN generated from .github/tags.txt [SIGNATURE] -- do not hand-edit -->"
            printf '<details>\n'
            printf '<summary><b>Topics</b> — %d tags, generated from <code>.github/tags.txt</code></summary>\n\n' "${#TAGS[@]}"
            for t in "${TAGS[@]}"; do
              printf '`#%s` ' "$(printf '%s' "$t" | sed -E 's/(^|-)([a-z])/\U\2/g')"
            done
            printf '\n\n</details>\n'
            echo "<!-- TAGS:END -->"
          } > /tmp/sig.md

          awk '
            /<!-- TAGS:BEGIN/ { skip=1; while ((getline line < "/tmp/sig.md") > 0) print line; next }
            /<!-- TAGS:END/   { skip=0; next }
            !skip
          ' README.md > /tmp/README.md && mv /tmp/README.md README.md

          # 2. CITATION.cff keywords -- also the unlimited tier. Zenodo and
          #    OpenAIRE index these and impose no 20-cap either.
          {
            echo "keywords:"
            # QUOTED, and that is load-bearing. MEASURED 2026-08-01: the tree
            # carries `  - "tag"` while this line emitted `  - tag`, so every
            # run produced a 42-line diff and tried to commit it -- and
            # checker/tags-consistency.sh parses keywords with
            # `grep -o '"[^"]*"'`, which would have found ZERO keywords in the
            # rewritten file and failed the gate with "CITATION.cff has no
            # keywords". The generator and the parser must agree on the format;
            # tags-consistency.sh phase 5b now asserts that they do.
            for t in "${TAGS[@]}"; do echo "  - \"$t\""; done
          } > /tmp/kw.yaml
          awk '
            /^keywords:/      { skip=1; while ((getline line < "/tmp/kw.yaml") > 0) print line; next }
            skip && /^  - /   { next }
            skip && !/^  - /  { skip=0 }
            !skip
          ' CITATION.cff > /tmp/CITATION.cff && mv /tmp/CITATION.cff CITATION.cff

      # 3. The repo topics themselves. This is the structured descendant of the
      #    forum signature tag -- each becomes a crawlable github.com/topics page.
      # VERIFY, THEN REPAIR -- rewritten 2026-08-01 after this step failed with
      # `gh: Resource not accessible by integration (HTTP 403)`.
      #
      # The old version went straight to PUT and let a permission error fail the
      # run. That conflates two completely different states:
      #
      #   * the live topics DISAGREE with tags.txt      -> a real defect, be red
      #   * the live topics AGREE and the token may not
      #     have written them this minute                -> nothing is wrong
      #
      # A red run for the second case trains everyone to ignore the workflow,
      # and the obvious "fix" is to delete the step -- which would remove the
      # only thing that notices the first case. So: READ first (GET /topics
      # needs no special permission), compare as a SET against the source of
      # truth, and only attempt the write when they actually differ. If the
      # write is then refused, THAT is an error worth failing on, because real
      # drift exists and this workflow cannot repair it.
      - name: Sync repo topics (verify, then repair)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          sort -u /tmp/topics.txt > /tmp/want.txt

          gh api "repos/${GITHUB_REPOSITORY}/topics" --jq '.names[]' 2>/dev/null             | sort -u > /tmp/have.txt || : > /tmp/have.txt
          echo "declared: $(wc -l < /tmp/want.txt)   live: $(wc -l < /tmp/have.txt)"

          if diff -q /tmp/want.txt /tmp/have.txt >/dev/null 2>&1; then
            echo "topics already match .github/tags.txt -- nothing to push."
            echo "(A no-op is the correct outcome of a sync job that finds no drift.)"
            exit 0
          fi

          echo "DRIFT between the live topics and tags.txt:"
          echo "  only declared: $(comm -23 /tmp/want.txt /tmp/have.txt | paste -sd' ' -)"
          echo "  only live:     $(comm -13 /tmp/want.txt /tmp/have.txt | paste -sd' ' -)"

          args=()
          while read -r t; do args+=( -f "names[]=$t" ); done < /tmp/topics.txt
          if gh api -X PUT "repos/${GITHUB_REPOSITORY}/topics" "${args[@]}" > /tmp/topics.json; then
            echo "topics now:"; cat /tmp/topics.json
          else
            rc=$?
            echo "::error::the topics DRIFTED from .github/tags.txt and this token cannot fix it (gh exit $rc)."
            echo "::error::GITHUB_TOKEN needs 'administration: write', and an org policy may still refuse it."
            echo "::error::Apply the 20 topics by hand, or give the workflow a PAT. This is REAL drift, not a permission nit."
            exit 1
          fi

      # REPORT THE DRIFT; DO NOT COMMIT IT. Rewritten 2026-08-01 after the
      # push was refused:
      #
      #   remote: - 4 of 4 required status checks are expected.
      #   ! [remote rejected] main -> main (push declined due to repository
      #     rule violations)
      #
      # `main` is now protected by a ruleset: no deletion, no force-push, and
      # four required status checks. The GitHub Actions app CANNOT be granted a
      # bypass at repository level -- the API refuses it with "Actor GitHub
      # Actions integration must be part of the ruleset source or owner
      # organization" (HTTP 422, measured).
      #
      # The constraint forced a better design than the one it broke. A bot
      # pushing unreviewed commits to a protected branch is precisely what the
      # protection exists to prevent, and weakening the ruleset to let one
      # through would have been closing an alarm by disarming it.
      #
      # NOTHING WRITES TO main EXCEPT A HUMAN. This step now FAILS on drift and
      # prints the diff, so the fix lands in a commit somebody signed. It costs
      # nothing in coverage: checker/tags-consistency.sh gates the very same
      # invariant locally and in CI, on every commit rather than three times a
      # week.
      - name: Fail if the derived copies have drifted (never commit them)
        run: |
          set -uo pipefail
          if git diff --quiet -- README.md CITATION.cff; then
            echo "README.md and CITATION.cff already match .github/tags.txt."
            echo "(A no-op is the correct outcome. Nothing is committed, and nothing is faked.)"
            exit 0
          fi
          echo "::error::README.md / CITATION.cff have DRIFTED from .github/tags.txt."
          echo "::error::Run the same derivation locally and commit it yourself --"
          echo "::error::this job will not push to a protected branch."
          git --no-pager diff --stat -- README.md CITATION.cff
          git --no-pager diff -- README.md CITATION.cff | head -80
          exit 1
