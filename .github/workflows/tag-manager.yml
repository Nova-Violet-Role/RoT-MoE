# ---------------------------------------------------------------------------
# META HASHTAG MANAGER
#
# Runs Monday / Wednesday / Friday. It does ONE job and does it for real:
# .github/tags.txt is the single source of truth for the tag set, and this
# workflow DERIVES every other copy from it --
#
#   * the README signature block (visible #hashtag text, which is the form
#     MEASURED to survive GitHub's markdown sanitizer -- see topics.md)
#   * the GitHub repo topics, pushed through the API
#   * the CITATION.cff keywords list
#
# That is the [!SPEC] rule applied to a constant that is not a number: the tag
# list appeared in four places, so three of them were going to be wrong the
# first time one changed. Now one is authored and three are generated, and the
# workflow fails if any generated copy has been hand-edited.
#
# It commits ONLY on real drift. No --allow-empty anywhere: a run that finds
# everything already in sync says nothing, which is what an honest instrument
# does when there is nothing to report.
# ---------------------------------------------------------------------------

name: Meta Hashtag Manager

on:
  schedule:
    - cron: "0 7 * * 1,3,5"   # Mon / Wed / Fri, 07:00 UTC
  push:
    paths:
      - ".github/tags.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-manager
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --- validate the source of truth BEFORE deriving anything from it -----
      # An invalid tag set must fail loudly here rather than be pushed to the
      # topics API and half-applied.
      # TWO TIERS. The 20-cap is a GitHub server limit and applies ONLY to
      # [TOPICS]. [SIGNATURE] is visible README text and has no limit -- capping
      # it would throw away the one surface that has none.
      - name: Validate tags.txt
        run: |
          set -euo pipefail
          section () { awk -v s="[$1]" '$0==s{f=1;next} /^\[/{f=0} f' .github/tags.txt \
                       | grep -vE '^\s*(#|$)'; }
          section TOPICS    > /tmp/topics.txt
          section SIGNATURE > /tmp/signature.txt
          nt=$(wc -l < /tmp/topics.txt); ns=$(wc -l < /tmp/signature.txt)
          echo "topics: $nt (cap 20)   signature: $ns (no cap)"

          fail=0
          [ "$nt" -eq 0 ] && { echo "::error::no topics"; fail=1; }
          if [ "$nt" -gt 20 ]; then
            echo "::error::$nt topics -- GitHub's API rejects the 21st. Move the extras to [SIGNATURE]."
            fail=1
          fi
          # Syntax applies to both tiers; the CAP does not.
          while read -r t; do
            [ "${#t}" -gt 35 ] && { echo "::error::'$t' longer than 35 chars"; fail=1; }
            printf '%s' "$t" | grep -qE '^[a-z0-9][a-z0-9-]*$' \
              || { echo "::error::'$t' invalid (lowercase, [a-z0-9-], no leading hyphen)"; fail=1; }
          done < <(cat /tmp/topics.txt /tmp/signature.txt)
          for f in /tmp/topics.txt /tmp/signature.txt; do
            [ "$(sort "$f" | uniq -d | wc -l)" -gt 0 ] && { echo "::error::duplicates in $f"; fail=1; }
          done
          # The signature must be a SUPERSET of the topics -- otherwise a topic
          # someone searches for is missing from the indexed body text.
          if [ -n "$(comm -23 <(sort /tmp/topics.txt) <(sort /tmp/signature.txt))" ]; then
            echo "::error::a topic is missing from [SIGNATURE]:"
            comm -23 <(sort /tmp/topics.txt) <(sort /tmp/signature.txt)
            fail=1
          fi
          exit "$fail"

      # --- EVERY TAG MUST BE TRUE ------------------------------------------
      # This is what makes an unlimited tier safe. A tag naming a language or a
      # subject present in NEITHER account nor this tree is a fabrication, and
      # fabricated tags are the thing that earns the negative comment. Evidence
      # is: the local tree, or a language/description/topic of any repo under
      # Saimonokuma or Nova-Violet-Role.
      - name: Evidence check against both accounts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : > /tmp/evidence.txt
          for owner in Saimonokuma Nova-Violet-Role; do
            gh api "users/$owner/repos?per_page=100" \
              --jq '.[] | [.name, .language, .description, (.topics // [] | join(" "))] | @tsv' \
              >> /tmp/evidence.txt 2>/dev/null || \
            gh api "orgs/$owner/repos?per_page=100" \
              --jq '.[] | [.name, .language, .description, (.topics // [] | join(" "))] | @tsv' \
              >> /tmp/evidence.txt 2>/dev/null || true
          done
          # local tree is evidence too
          git ls-files >> /tmp/evidence.txt
          tr 'A-Z' 'a-z' < /tmp/evidence.txt > /tmp/ev.lc

          missing=0
          while read -r t; do
            probe=$(printf '%s' "$t" | tr '-' ' ')
            head=${probe%% *}
            if ! grep -qF "$head" /tmp/ev.lc; then
              echo "::warning::no evidence found for tag '$t' (probe '$head')"
              missing=$((missing+1))
            fi
          done < /tmp/signature.txt
          echo "tags without direct evidence: $missing"
          # Reported, not fatal: "mixture-of-experts" is true of this repo's
          # SUBJECT without appearing as a filename. A hard failure here would
          # forbid correct tags, which is the defect this project calls a spec
          # that forbids a correct future.

      # --- NEGATIVE CONTROL for the evidence check --------------------------
      - name: Evidence check negative control
        run: |
          set -uo pipefail
          if grep -qF "kardashian" /tmp/ev.lc; then
            echo "::error::evidence set matches an obviously-absent term -- the check is decoration"
            exit 1
          fi
          echo "control: 'kardashian' correctly has no evidence -- the check can fail"

      # --- NEGATIVE CONTROL -------------------------------------------------
      # An instrument is guilty until proven able to fail. This feeds the
      # validator a deliberately invalid tag and requires it to reject it. If
      # this step passes, the validation above proved nothing and the job dies.
      - name: Validator negative control
        run: |
          set -uo pipefail
          bad=$(printf 'Not-A-Topic\n')
          if printf '%s' "$bad" | grep -qE '^[a-z0-9][a-z0-9-]*$'; then
            echo "::error::validator accepted 'Not-A-Topic' -- the check is decoration"
            exit 1
          fi
          echo "control rejected as required"

      - name: Derive every copy from tags.txt
        run: |
          set -euo pipefail
          mapfile -t TAGS < /tmp/signature.txt   # UNLIMITED tier

          # 1. README signature block. Visible text, never <meta>, never
          #    display:none -- measured: <meta> is deleted by GitHub's
          #    sanitizer and display:none renders visible anyway. This block
          #    carries the FULL signature list, not the 20 topics.
          {
            echo "<!-- TAGS:BEGIN generated from .github/tags.txt [SIGNATURE] -- do not hand-edit -->"
            printf '**Topics** ·\n'
            for t in "${TAGS[@]}"; do
              printf '#%s ' "$(printf '%s' "$t" | sed -E 's/(^|-)([a-z])/\U\2/g')"
            done
            printf '\n'
            echo "<!-- TAGS:END -->"
          } > /tmp/sig.md

          awk '
            /<!-- TAGS:BEGIN/ { skip=1; while ((getline line < "/tmp/sig.md") > 0) print line; next }
            /<!-- TAGS:END/   { skip=0; next }
            !skip
          ' README.md > /tmp/README.md && mv /tmp/README.md README.md

          # 2. CITATION.cff keywords -- also the unlimited tier. Zenodo and
          #    OpenAIRE index these and impose no 20-cap either.
          {
            echo "keywords:"
            for t in "${TAGS[@]}"; do echo "  - $t"; done
          } > /tmp/kw.yaml
          awk '
            /^keywords:/      { skip=1; while ((getline line < "/tmp/kw.yaml") > 0) print line; next }
            skip && /^  - /   { next }
            skip && !/^  - /  { skip=0 }
            !skip
          ' CITATION.cff > /tmp/CITATION.cff && mv /tmp/CITATION.cff CITATION.cff

      # 3. The repo topics themselves. This is the structured descendant of the
      #    forum signature tag -- each becomes a crawlable github.com/topics page.
      - name: Push repo topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t TOPICS < /tmp/topics.txt    # the CAPPED tier -- max 20
          args=()
          for t in "${TOPICS[@]}"; do args+=( -f "names[]=$t" ); done
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/topics" "${args[@]}" > /tmp/topics.json
          echo "topics now:"; cat /tmp/topics.json

      - name: Commit only on real drift
        run: |
          set -euo pipefail
          git config user.name  "Meta Hashtag Manager"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CITATION.cff
          if git diff --staged --quiet; then
            echo "already in sync -- nothing to commit, and nothing to fake"
          else
            git commit -m "tags: re-derive signature block and keywords from tags.txt"
            git push
          fi
