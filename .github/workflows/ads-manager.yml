# ---------------------------------------------------------------------------
# ADS MANAGER
#
# Runs Monday / Wednesday / Friday, alongside the Meta Hashtag Manager.
#
# It writes the promotional copy -- and it is built so that it CANNOT write a
# claim the repo has not proved. Every number in PROMO.md is read out of
# STATUS.md, which is written by verify.yml from a real run of the three
# instruments. Nothing here is typed by a human and nothing is rounded up.
#
# Then it turns around and audits the README the same way. Any theorem count,
# mutation count or "zero sorry" claim in README.md that disagrees with ground
# truth fails the job. That is the point of naming it after advertising: the
# most dangerous copy in this repo is the copy that sounds good, and the bot
# whose job is to write it is exactly the bot that should be forbidden to lie.
#
# An advertisement this project cannot substantiate is worse than no
# advertisement -- it is the negative GitHub comment, pre-written by us.
# ---------------------------------------------------------------------------

name: Ads Manager

on:
  schedule:
    - cron: "0 8 * * 1,3,5"   # Mon / Wed / Fri, 08:00 UTC -- one hour after tags
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ads-manager
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Ground truth is counted from the sources, never from memory and never
      # from the previous run of this file.
      - name: Measure ground truth
        id: gt
        run: |
          set -euo pipefail
          # awk, not `... | paste -sd+ | bc` -- bc is not installed everywhere
          # (it is absent on this project's own dev machine), and a counter that
          # dies on a missing tool would fail the job for a reason that has
          # nothing to do with the repo being correct.
          # The SHARED counter, comment-aware, selftest first. The bare grep this
          # replaces missed `lemma` entirely and counted a `theorem` written
          # inside a doc comment -- wrong in both directions at once, and this
          # job's whole purpose is to fail the build when a number is wrong.
          bash checker/count-theorems.sh --selftest
          THMS=$(bash checker/count-theorems.sh lean/Proofs/*.lean)
          # `|| true` IS LOAD-BEARING, and the reason is the whole bug this job
          # had. `grep -c` prints its zero counts AND EXITS 1 when nothing
          # matched. With `set -o pipefail` on line 50 that status propagates
          # through the pipe, `set -e` kills the step, and the job fails.
          #
          # Measured 2026-08-02 by dispatching this workflow by hand: it had
          # NEVER run (created Sat 01 Aug, first Monday cron was 03 Aug), and
          # the first run died right here.
          #
          # The direction is what makes it serious. It failed BECAUSE the corpus
          # is clean -- zero native_decide, so zero matches, so exit 1. Add one
          # native_decide and grep would exit 0 and the step would sail past.
          # An alarm that fires on correctness and goes quiet on the defect is
          # worse than no alarm; the two steps below read these very numbers to
          # refuse to advertise an unproved repo.
          #
          # SECOND BUG, same step, same direction. Even once the status was
          # rescued, `grep -rc sorry` reported **3** on a corpus with ZERO real
          # holes. The hits were a doc comment, a line of prose, and the THEOREM
          # NAME `sorry_always_speaks` -- `_` is not a word boundary for a naive
          # pattern. The step below refuses to advertise when sorry != 0, so the
          # job would have failed for being CLEAN.
          #
          # checker/status-verdict.sh already solved this: it strips NESTING
          # Lean block comments, drops line comments, and requires the token to
          # be bounded by non-identifier characters. That fix lived in a shell
          # function nobody outside the file could call, so it was rewritten
          # here badly. It is now exposed as `--count`, and this job uses it.
          # One counter, one selftest, two callers.
          SORRY=$(bash checker/status-verdict.sh --count sorry)
          NATIVE=$(bash checker/status-verdict.sh --count native_decide)
          MODULES=$(ls lean/Proofs/*.lean | wc -l)
          TOOLCHAIN=$(cat lean/lean-toolchain)
          {
            echo "thms=$THMS"
            echo "sorry=$SORRY"
            echo "native=$NATIVE"
            echo "modules=$MODULES"
            echo "toolchain=$TOOLCHAIN"
          } >> "$GITHUB_OUTPUT"
          echo "theorems=$THMS modules=$MODULES sorry=$SORRY native_decide=$NATIVE"

      # A promotional file that advertises `sorry` would be a contradiction in
      # terms. This is the gate, not a warning.
      - name: Refuse to advertise an unproved repo
        run: |
          set -euo pipefail
          if [ "${{ steps.gt.outputs.sorry }}" -ne 0 ]; then
            echo "::error::${{ steps.gt.outputs.sorry }} sorry found -- nothing to advertise"; exit 1
          fi
          if [ "${{ steps.gt.outputs.native }}" -ne 0 ]; then
            echo "::error::native_decide found -- the kernel did not check that"; exit 1
          fi

      - name: Require a STATUS.md from a real verify run
        run: |
          set -euo pipefail
          if [ ! -f STATUS.md ]; then
            echo "::error::no STATUS.md -- verify.yml has not run, so there is no verdict to quote"
            exit 1
          fi
          # WAS: grep -q 'exit 0' STATUS.md
          # That string is emitted NOWHERE by checker/status-verdict.sh, so this step could
          # only ever fail -- measured on run 30741010899, with a correct STATUS.md present.
          # It asserted a RENDERING detail instead of the property that matters, which is the
          # same frozen-snapshot defect as the sim's week 1. Replaced with two structural
          # assertions over what the generator actually guarantees:
          #   1. the VERDICT markers -- proves the file came from status-verdict.sh, not a hand edit
          #   2. the proof-critical rows are ZERO -- that IS "the repo is proved", and both rows
          #      are recounted from source on every run, so they move with the code.
          # `grep -q` is used unpiped here (no SIGPIPE hazard); the repo ban is on `| grep -q`.
          fail=0
          for marker in 'VERDICT-BEGIN' 'VERDICT-END'; do
            hit=$(grep -c "$marker" STATUS.md || true)
            case "$hit" in
              0) echo "::error::STATUS.md has no $marker -- not generated by checker/status-verdict.sh"; fail=1 ;;
            esac
          done
          for row in 'sorry' 'native_decide'; do
            hit=$(grep -cE "files containing \`$row\` \| 0 \|" STATUS.md || true)
            case "$hit" in
              0) echo "::error::STATUS.md does not record ZERO files containing $row -- refusing to advertise"; fail=1 ;;
            esac
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "STATUS.md carries a generated verdict with zero sorry and zero native_decide"

      - name: Write PROMO.md from measured numbers only
        run: |
          set -euo pipefail
          # `grep` exits 1 when it matches NOTHING, and under `set -o pipefail` that kills
          # the step -- even though line 164 already carries a `${MUT:-...}` fallback for
          # exactly this case. checker/status-verdict.sh does not emit a mutation line, so
          # the no-match path is the NORMAL one and the step could never reach its own
          # fallback. Measured: run 30741389448, step 6.
          # Third instance of this class in these two bots (grep -rc native_decide, grep -rc
          # sorry, now grep -oE) -- rescuing the status keeps the VALUE, which is what the
          # fallback wants. An empty MUT is honest: the ad then says "see STATUS.md" instead
          # of inventing mutation numbers nothing measured.
          MUT=$(grep -oE '[0-9]+ killed, [0-9]+ survived, [0-9]+ discarded' STATUS.md | head -1 || true)
          {
            echo "<!-- generated by Ads Manager from STATUS.md and lean/Proofs/. Do not hand-edit. -->"
            echo "# RoT MoE — the short version"
            echo
            echo "A real Mixture-of-Experts router for Claude Code: nine lenses, a gauge"
            echo "measured off disk, and a Lean 4 proof that the gauge is not decoration."
            echo
            echo "| claim | evidence |"
            echo "|---|---|"
            echo "| ${{ steps.gt.outputs.thms }} theorems across ${{ steps.gt.outputs.modules }} modules | \`lake build\` exit 0 |"
            echo "| zero \`sorry\`, no \`native_decide\` | counted in \`lean/Proofs/\` by this job |"
            echo "| kernel re-verified | \`lake env leanchecker\`, control exits 1 |"
            echo "| ${MUT:-mutation suite: see STATUS.md} | mutation suite with presence assertion |"
            echo "| toolchain | \`${{ steps.gt.outputs.toolchain }}\` |"
            echo
            echo "## What is NOT claimed"
            echo
            echo "Lean proves the router's arithmetic and branch structure. It does not"
            echo "prove the reasoning is better for being routed — that is output quality"
            echo "and it is outside Lean entirely. It does not see the PowerShell or the"
            echo "shell port either; those are bound by \`checker/\`. Anything measured but"
            echo "not proved is labelled MEASURED here and everywhere else in this repo."
          } > PROMO.md

      # --- the audit, and the reason this bot exists ------------------------
      # Any number in the README that ground truth does not support fails the
      # job. NEGATIVE CONTROL below proves the audit can actually fail.
      - name: Audit README claims against ground truth
        run: |
          set -euo pipefail
          fail=0
          # WAS: take the FIRST '<n> theorems' match in README.md and compare it to the repo
          # TOTAL. That is a scope error, and it fired on a correct README: the first match is
          # `lean/Proofs/RotGauge.lean` (35 theorems) -- a PER-MODULE count -- which was then
          # compared against the 139 total. Measured: run 30742048586.
          #
          # The README was right and the audit was wrong. Deleting the check was the tempting
          # repair; instead it is now strictly STRONGER -- every per-module claim is recounted
          # from its own file, so drift in ANY module line fails, not just the first one, and
          # no scope confusion is possible. The total is then checked as the SUM, which is the
          # relationship that actually has to hold rather than a snapshot of one number.
          sum=0
          while IFS= read -r line; do
            f=$(printf '%s' "$line" | sed -n 's|.*`lean/Proofs/\([A-Za-z0-9_]*\.lean\)`.*|\1|p')
            n=$(printf '%s' "$line" | sed -n 's|.*(\([0-9]\{1,\}\) theorems.*|\1|p')
            [ -n "$f" ] && [ -n "$n" ] || continue
            if [ ! -f "lean/Proofs/$f" ]; then
              echo "::error::README documents lean/Proofs/$f which does not exist"; fail=1; continue
            fi
            a=$(bash checker/count-theorems.sh "lean/Proofs/$f" 2>/dev/null || echo ERR)
            if [ "$a" != "$n" ]; then
              echo "::error::README says lean/Proofs/$f has $n theorems; it has $a"; fail=1
            fi
            sum=$((sum + n))
          done < <(grep -nE '`lean/Proofs/[A-Za-z0-9_]*\.lean`.*\([0-9]+ theorems' README.md || true)
          if [ "$sum" -eq 0 ]; then
            echo "::error::no per-module theorem claims found in README -- the audit would be vacuous"
            fail=1
          elif [ "$sum" -ne "${{ steps.gt.outputs.thms }}" ]; then
            echo "::error::README per-module claims sum to $sum; sources have ${{ steps.gt.outputs.thms }}"
            fail=1
          fi
          if grep -qiE 'proves.*(quality|better reasoning|smarter)' README.md; then
            echo "::error::README claims a proof about output QUALITY -- Lean cannot support that"
            fail=1
          fi

          # THE MARKETPLACE LISTING IS THE MOST PUBLIC CLAIM IN THE REPO AND WAS AUDITED
          # BY NOTHING. `.claude-plugin/marketplace.json` hardcodes the theorem count in
          # its description, and that string is what a stranger reads on the plugin hub
          # before they read anything else. `grep -rln marketplace.json checker/ .github/`
          # returned EMPTY -- no gate touched it. A number nobody recounts is a number
          # that goes stale the next time a theorem lands.
          MKT=.claude-plugin/marketplace.json
          if [ ! -f "$MKT" ]; then
            echo "::error::$MKT is missing -- the plugin hub resolves it from the default branch"
            fail=1
          else
            # Refuse a listing that is not machine-readable BEFORE trusting any claim in it.
            if ! node -e "JSON.parse(require('fs').readFileSync('$MKT','utf8'))" 2>/dev/null; then
              echo "::error::$MKT is not valid JSON -- the hub cannot ingest it"
              fail=1
            fi
            mkt_claims=$(grep -oE '[0-9]+ machine-checked theorems' "$MKT" | grep -oE '^[0-9]+' || true)
            if [ -z "$mkt_claims" ]; then
              echo "::error::$MKT states no theorem count -- the audit would be vacuous, state it or drop the claim"
              fail=1
            else
              for c in $mkt_claims; do
                if [ "$c" -ne "${{ steps.gt.outputs.thms }}" ]; then
                  echo "::error::$MKT advertises $c machine-checked theorems; sources have ${{ steps.gt.outputs.thms }}"
                  fail=1
                fi
              done
            fi
            # The same two proof-critical claims the README carries, on the public listing.
            for row in sorry native_decide; do
              case "$row" in
                sorry)         want="${{ steps.gt.outputs.sorry }}" ;;
                native_decide) want="${{ steps.gt.outputs.native }}" ;;
              esac
              hit=$(grep -c "zero $row" "$MKT" || true)
              case "$hit:$want" in
                0:0) : ;;                       # claim absent, nothing to check
                *:0) : ;;                       # claim present and TRUE
                *)   echo "::error::$MKT advertises 'zero $row' but ground truth counts $want"
                     fail=1 ;;
              esac
            done
          fi
          exit "$fail"

      - name: Audit negative control
        run: |
          set -uo pipefail
          # THIS CONTROL WAS STALE. It tested the OLD audit (first '<n> theorems' match
          # vs the repo total) against a fake file -- logic that no longer exists after
          # the audit became per-module. A control that exercises a deleted code path is
          # decoration: it passed while proving nothing about the live rule.
          #
          # It now runs the REAL audit loop over a README whose per-module count is wrong
          # by one, and requires it to refuse. If the audit ever stops detecting drift,
          # this step fails.
          sed 's/(35 theorems)/(34 theorems)/' README.md > /tmp/fake-readme.md
          # Assert the mutation LANDED. A patch that silently fails to apply would leave
          # this control passing against an unmodified file -- the exact way a mutation
          # harness lies in the reassuring direction.
          applied=$(grep -c '(34 theorems)' /tmp/fake-readme.md || true)
          case "$applied" in
            0) echo "::error::control mutation did not apply -- this control proves nothing"; exit 1 ;;
          esac
          cfail=0; csum=0
          while IFS= read -r line; do
            f=$(printf '%s' "$line" | sed -n 's|.*`lean/Proofs/\([A-Za-z0-9_]*\.lean\)`.*|\1|p')
            n=$(printf '%s' "$line" | sed -n 's|.*(\([0-9]\{1,\}\) theorems.*|\1|p')
            [ -n "$f" ] && [ -n "$n" ] || continue
            a=$(bash checker/count-theorems.sh "lean/Proofs/$f" 2>/dev/null || echo ERR)
            [ "$a" = "$n" ] || cfail=1
            csum=$((csum + n))
          done < <(grep -nE '`lean/Proofs/[A-Za-z0-9_]*\.lean`.*\([0-9]+ theorems' /tmp/fake-readme.md || true)
          if [ "$cfail" -eq 0 ] && [ "$csum" -eq "${{ steps.gt.outputs.thms }}" ]; then
            echo "::error::the audit accepted a README with a wrong module count -- it is decoration"; exit 1
          fi
          echo "control: the audit refused the drifted README (module mismatch=$cfail, sum=$csum vs ${{ steps.gt.outputs.thms }})"

      # REPORT, DO NOT PUSH -- see tag-manager.yml for the measurement. `main`
      # is protected (no deletion, no force-push, four required checks) and the
      # GitHub Actions app cannot hold a repository-level bypass. A bot pushing
      # unreviewed commits is what the protection exists to stop; the fix is to
      # remove the write, never to weaken the rule.
      - name: Fail if PROMO.md has drifted (never commit it)
        run: |
          set -uo pipefail
          if git diff --quiet -- PROMO.md; then
            echo "copy unchanged -- nothing to commit, and nothing to fake"
            exit 0
          fi
          echo "::error::PROMO.md no longer matches the measured numbers (${{ steps.gt.outputs.thms }} theorems)."
          echo "::error::Regenerate it locally and commit it yourself -- this job will not push to a protected branch."
          git --no-pager diff -- PROMO.md | head -60
          exit 1

