# =============================================================================
# CI -- every gate, on a clean clone, on a machine that is not the author's.
#
# The point of this file is not "tests pass". It is that they pass somewhere
# with NO LOCAL STATE: no mathlib cache warmed by hand, no toolchain the author
# happens to have, no ~/.claude built up over months. A green here is the first
# evidence the packet works for someone else.
#
# TWO THINGS CI CAN DO THAT THE DEVELOPMENT MACHINE CANNOT, and they are the
# reason this is not just a duplicate run:
#
#   1. THE LOCALE TRAP. Measured on the dev machine: awk there formats %.2f in
#      the C locale REGARDLESS of LC_ALL, so the mutation that forces a
#      comma-decimal locale is INEXPRESSIBLE and is recorded as such -- not as
#      killed, not as survived. glibc awk on ubuntu DOES honour the locale, so
#      the trap can finally be expressed here.
#   2. THE TTY GUARD. The router must refuse to block when stdin is a terminal.
#      /dev/tty does not exist in the dev machine's non-interactive shell and
#      winpty needs a console it does not have, so the guard is UNTESTED there.
#      util-linux `script` gives a real pty here.
#
# A job that SKIPS a phase says so. A skip is never counted as a pass.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Reusable: verify.yml calls this instead of duplicating every gate. Two
  # workflows running the same checks is two places for them to drift, and the
  # one that drifts is always the one nobody reads.
  workflow_call:

permissions:
  contents: read
  # `actions: read` lets checker/deferred-closure.sh read the log archive of
  # the PREVIOUS completed run. It is the least privilege that closes the
  # half of the CI step list ci-dryrun.sh must defer -- toolchain installs,
  # the mathlib cache, the real lake build, the kernel re-check. Without it
  # that gate SKIPs, and a SKIP is never counted as a pass here.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  checkers:
    name: checkers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one platform failing must not hide the other two
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: preflight -- what is available here
        shell: bash
        run: bash checker/preflight.sh

      - name: install comma-decimal locales (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo locale-gen de_DE.UTF-8 fr_FR.UTF-8
          sudo update-locale
          # Prove the trap is expressible HERE before relying on it below.
          echo "awk under de_DE.UTF-8: $(LC_ALL=de_DE.UTF-8 awk 'BEGIN{printf "%.2f", 0.09}')"

      # Required files present, and every count in the prose RECOUNTED from
      # source. A README that claims more theorems than exist is the project
      # lying about the one thing it sells.
      # The counter that every prose claim is checked against must itself be
      # able to fail: its selftest plants a theorem inside a doc comment and
      # requires it NOT to be counted.
      - name: theorem counter selftest
        shell: bash
        run: bash checker/count-theorems.sh --selftest

      - name: repo completeness + count drift
        shell: bash
        run: bash checker/repo-complete.sh

      - name: SPDX + copyright sweep
        shell: bash
        run: sh checker/spdx-sweep.sh

      - name: no machine-local paths
        shell: bash
        run: sh checker/no-local-paths.sh

      - name: installer round trip (scratch config dir only)
        shell: bash
        run: bash checker/install-roundtrip.sh

      # THE RELEASE ARTIFACTS, BUILT AND THEN INSTALLED FROM THE ZIP.
      # These two run in this order and only in this order: release-install.sh
      # REFUSES (exit 2) if the archives are not on disk, because installing a
      # stale artifact proves something about a tree nobody is shipping. That
      # already happened once here -- a zip built before a fix was tested after
      # it, and reported a defect that no longer existed.
      #
      # install-roundtrip.sh above proves the installer works IN THE REPOSITORY.
      # This proves it works the way a stranger meets it: unzipped somewhere with
      # no git, no checker/, no lean/ beside it.
      # MEASURED on windows-latest, run #20: `REFUSE: zip absent`, exit 2. The
      # Windows runner's Git Bash ships `unzip` but NOT `zip`. My own Git Bash
      # has zip installed, which is exactly why this never appeared locally --
      # a tool present on the development machine and absent on the runner is
      # invisible until the runner says so.
      #
      # The alternative was to skip packaging on Windows. Rejected: that would
      # also drop release-install.sh, which needs the archives and is the ONE
      # test that exercises the installer on the platform where path handling,
      # CRLF and the PowerShell arm actually differ. Provisioning one tool costs
      # less than losing that coverage.
      - name: provide zip on the Windows runner (Git Bash ships unzip only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command zip -ErrorAction SilentlyContinue) {
            "zip already present"
          } else {
            choco install zip -y --no-progress
          }
          # Fail loudly here rather than as a REFUSE three steps later.
          if (-not (Get-Command zip -ErrorAction SilentlyContinue)) {
            Write-Error "zip is still absent after install -- packaging cannot run"
            exit 1
          }
          zip -v | Select-Object -First 2

      - name: release artifacts build, and assert their own contents
        shell: bash
        run: bash checker/release-package.sh

      - name: release artifacts install from the zip (scratch config dir only)
        shell: bash
        run: bash checker/release-install.sh

      # The Lean witness uses the SHIPPING weights on purpose, so the proofs
      # apply to the profile in production. Retune LAMBDAS and every other gate
      # stays green while "proved for the shipping profile" quietly goes false.
      - name: Lean witness must match the shipped weights
        shell: bash
        run: bash checker/lean-binds-shell.sh

      - name: cross-diff -- both router arms + locale invariance
        shell: bash
        run: bash checker/cross-diff.sh

      # Organ 4 has two arms for the same reason the router does, so it gets the
      # same instrument. The runner has PowerShell, so this is a real comparison
      # here rather than the POSIX-only degraded mode.
      - name: cross-diff -- both reminder arms (organ 4)
        shell: bash
        run: bash checker/cross-diff-remind.sh

      # CLAUDE.md and /rot-moe-install are instructions to an AGENT WITH A
      # SHELL. A stale path in them is not a documentation nit -- it is an
      # agent improvising on someone else's machine.
      - name: install-document lint -- the agent-facing docs cannot go stale
        shell: bash
        run: bash checker/claude-md-lint.sh

      # The architecture blueprint is proprietary; this tree is copyleft. The
      # bridge between them must describe the evidence that EXISTS -- and must
      # stop hedging the day the written grant is filed.
      - name: licence bridge -- NOTICE.md must match what is on disk
        shell: bash
        run: bash checker/license-bridge.sh

      # tag-manager.yml owns the invariants that need the API (the evidence
      # scan). These are the ones that need nothing at all, so they run on
      # every commit and, crucially, on a machine with no remote.
      - name: release consistency -- version, tag and date cannot disagree
        shell: bash
        run: bash checker/release-consistency.sh

      - name: tag consistency -- tags.txt, README and CITATION cannot drift
        shell: bash
        run: bash checker/tags-consistency.sh

      # verify.yml commits STATUS.md "only when the verdict changed". Until
      # 2026-08-01 it wrote `date -u` and ${GITHUB_SHA} INTO the file it then
      # compared, so the silent branch was unreachable and the weekly job would
      # have committed forever -- the green-square behaviour its own comment
      # forbids. These two hold the fixed design: the first structurally, the
      # second by RUNNING verify.yml's own `run:` blocks for three weeks
      # against a scratch bare remote and counting the commits that land.
      - name: verdict stability -- the scheduled commit rule can say nothing
        shell: bash
        run: bash checker/verdict-stability.sh

      - name: scheduled verdict, three weeks with a real (local) remote
        shell: bash
        run: bash checker/verdict-schedule-sim.sh

      # The Float mirror in RotGauge.lean carries "-- hook reported 0.49"
      # comments. Those were hand-written claims of agreement that nothing
      # re-measured. This runs BOTH arms and diffs them; it SKIPS (exit 3),
      # never passes, when there is no built Lean workspace.
      - name: gauge cross-check -- Lean mirror vs the running hook
        shell: bash
        run: |
          set +e
          LEAN_ROOT="$GITHUB_WORKSPACE/lean" bash checker/gauge-cross.sh; rc=$?
          [ "$rc" -eq 3 ] && { echo "SKIPPED: no built Lean workspace -- NOT a pass"; exit 0; }
          exit $rc

      - name: mutate the checker -- it must be able to fail
        shell: bash
        run: bash checker/mutate-checker.sh

      # These SKIP (exit 3) when the claude CLI is absent, which it is on a
      # bare runner. A skip is reported as a skip; it is never a pass.
      - name: plugin + fresh-user install (skips without the CLI)
        shell: bash
        run: |
          set +e
          bash checker/plugin-install.sh; rc=$?
          [ "$rc" -eq 3 ] && { echo "SKIPPED: claude CLI absent -- NOT a pass"; exit 0; }
          exit $rc

      # Catches a checker that CI never runs -- the repo would look more
      # verified than it is, with a green tick saying nothing about it.
      # NOT run here on purpose: ci-dryrun.sh executes THIS workflow's own step
      # list in a clean clone, so running it inside the workflow would recurse.
      # It is a --full gate locally, which is where a step-list defect must be
      # caught -- before the push, not by it.

      - name: workflow lint -- parse + drift
        shell: bash
        run: bash checker/workflow-lint.sh

      - name: live-session smoke (skips without the CLI)
        shell: bash
        run: |
          set +e
          bash checker/live-session-smoke.sh; rc=$?
          [ "$rc" -eq 3 ] && { echo "SKIPPED: claude CLI absent -- NOT a pass"; exit 0; }
          exit $rc

      # DELIBERATELY NOT RUN HERE: checker/release-session.sh and
      # checker/release-longsession.sh.
      #
      # I added both as workflow steps and then removed them, because a step that
      # can NEVER do its job still paints a green check. Both need the `claude`
      # CLI, and the sustained one additionally needs a credential to clone. A
      # public GitHub runner has neither and never will, so both would report
      # "SKIPPED" on every run for the life of the repository -- a permanent
      # green tick measuring nothing. The exit-3 convention is honest inside the
      # gate; it is NOT honest as a CI step that is guaranteed to take it.
      #
      # They are --full gates in checker/gate-all.sh, which runs where a real
      # session is possible. That is the only place their green means anything,
      # and their results are reported by hand with the turn counts.
      #
      # SAME PROPERTY, PRE-EXISTING, RECORDED RATHER THAN HIDDEN: the
      # "plugin + fresh-user install" and "live-session smoke" steps above also
      # skip on every public runner for the same reason. They are left as they
      # were -- changing them is a separate decision -- but nobody should read
      # their green as evidence that a session ran.

      # The guard the development machine cannot test. `script` allocates a real
      # pty, so stdin IS a terminal and the router must refuse rather than block.
      # Bounded by timeout: a hang here is the exact failure being tested for,
      # and an unbounded hang reports nothing.
      - name: tty guard -- the router must not block on a terminal
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          timeout 15 script -q -e -c 'sh hooks/rot-router.sh' /dev/null > tty.out 2>&1
          rc=$?
          echo "exit=$rc"; cat tty.out
          if [ "$rc" -eq 124 ]; then echo "FAIL: the router BLOCKED on a tty"; exit 1; fi
          if [ "$rc" -eq 0 ];   then echo "FAIL: the router accepted a tty as hook input"; exit 1; fi
          grep -qi 'expects a JSON payload on stdin' tty.out \
            && echo "PASS: refused a terminal with the documented message" \
            || { echo "FAIL: refused, but not for the documented reason"; exit 1; }

  # --------------------------------------------------------------------------
  lean:
    name: lean -- build, axioms, kernel re-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install elan (toolchain pinned by lean/lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: toolchain (read, never assumed)
        working-directory: lean
        run: cat lean-toolchain && lake --version && lean --version

      - name: mathlib cache -- NEVER build it from source
        working-directory: lean
        run: lake exe cache get

      - name: lake build (exit code read DIRECTLY, never through a pipe)
        working-directory: lean
        run: |
          lake build Proofs.RotGauge Proofs.RotRoute Proofs.RotInstall Proofs.RotPath Proofs.RotRemind Proofs.RotAcquire Proofs.RotVerdict Proofs.RotVacuity Proofs.RotMutant Proofs.RotLens Proofs.RotAbility
          echo "lake build exit=$?"

      # A green build means it ELABORATED. It does not mean the theorems rest on
      # nothing unsound, and it does not mean there is no `sorry`.
      # THE STEP THAT USED TO BE HERE DID NEITHER THING ITS NAME CLAIMED, and it
      # is worth recording why rather than quietly replacing it. It looped over
      # a HAND-TYPED module list -- `RotGauge RotRoute RotInstall RotPath
      # RotVacuity` -- which had silently stopped covering RotRemind, RotAcquire
      # and RotVerdict as they were added; and for each one it wrote a file
      # containing a single `import` and elaborated it, never once running
      # `#print axioms`. Measured 2026-08-01: such a file exits 0 whatever the
      # module rests on, and a file containing `theorem c : 1 = 1 := by sorry`
      # ALSO exits 0, because `sorry` is a WARNING. The gate could not fail.
      # What remained was a text `grep sorry` with hand-tuned exclusions -- the
      # shape that reports a doc comment and the identifier `sorry_always_speaks`
      # as holes.
      #
      # checker/axiom-audit.sh enumerates the modules from disk, extracts every
      # theorem NAME (comment- and namespace-aware, attributes included),
      # `#print axioms` each, requires every name to be answered, cross-checks
      # its count against checker/count-theorems.sh, and plants a `sorry` to
      # prove it can fail.
      - name: portability -- exec bits in the index, CRLF-proof hooks
        run: bash checker/portability.sh

      # The Lean spec must GOVERN the shell. lean/Proofs/RotMutant.lean proves
      # a mutation may only be counted when the patch landed -- tool exit 0,
      # non-empty result, and genuinely changed. This asserts every mutation
      # harness in the tree implements that rule, by one of the two recognised
      # means. It found two live false-green paths the day it was written.
      - name: mutation discipline -- RotMutant.lean binds every harness
        run: bash checker/mutant-discipline.sh

      # The other end of ci-dryrun.sh. That gate runs what it can of this
      # step list in a clean tree and DEFERS anything needing a toolchain, a
      # download, root or a pty -- printing "DEFERRED IS NOT PASSED", which is
      # honest and leaves a gap. This closes the gap from the runner side: it
      # reads the log archive of the last completed run and requires every
      # declared step to have produced a log, with zero ##[error] and zero
      # ##[warning] anywhere in it.
      - name: deferred closure -- the runner ran what the dry run could not
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub runs this block as `bash -e {0}`, so a non-zero exit ABORTS
          # THE STEP BEFORE `rc=$?` is ever read. Measured in run 30695224024:
          # the gate exited 3 (SKIP), the step died on the spot, and the SKIP
          # branch below -- written precisely to tolerate it -- never ran. An
          # `if` makes the exit status part of a compound command, which `-e`
          # does not act on.
          if bash checker/deferred-closure.sh; then rc=0; else rc=$?; fi
          # 3 is SKIP (no token, no completed run yet, or logs expired) and is
          # NOT a pass -- it is reported and tolerated; 1 is a real failure.
          if [ "$rc" -eq 3 ]; then echo "::notice::deferred closure SKIPPED -- not a pass"; exit 0; fi
          exit "$rc"

      - name: benchmark -- routing accuracy on a labelled key, and per-turn cost
        run: bash checker/bench-router.sh

      - name: hook footprint -- no network, no lake, Lean stays optional
        run: bash checker/hook-footprint.sh

      - name: axiom audit -- #print axioms on every theorem, zero sorryAx
        run: LEAN_ROOT="$GITHUB_WORKSPACE/lean" bash checker/axiom-audit.sh

      # Classifies what a READER must trust, which the audit above does not ask:
      # KERNEL (the kernel checked it) vs COMPILER (native_decide -- executed,
      # not proved) vs BROKEN (sorryAx). This is the only gate that can catch a
      # native_decide theorem, because `leanchecker` exits 0 on one -- measured.
      # A declared axiom is trusted by definition, so the kernel re-check agrees
      # with the elaborator and stays silent.
      - name: axiom class -- KERNEL vs COMPILER vs BROKEN
        run: bash checker/axiom-class.sh

      # A theorem with contradictory hypotheses is TRUE, builds green, has clean
      # axioms and survives leanchecker -- and says nothing. This is the only
      # gate here that asks whether the hypotheses can ever HOLD.
      - name: non-vacuity audit -- every guarded theorem has a witness
        working-directory: lean
        run: lake build Proofs.RotVacuity

      - name: non-vacuity NEGATIVE CONTROL -- the audit must be able to fail
        working-directory: lean
        run: |
          set +e
          lake env lean mutate/vacuity_control.lean > vc.log 2>&1; rc=$?
          echo "control exit=$rc"; cat vc.log
          if [ "$rc" -eq 0 ]; then
            echo "CONTROL DEAD: a witness was produced for hypotheses 1 = 2."
            echo "The vacuity audit is decoration; fix it before trusting it."
            exit 1
          fi
          echo "PASS: the audit refuses a vacuous theorem (exit $rc)"

      # A [DECORATIVE] label is an opinion until something tests it. This file
      # states the decorative shape and the load-bearing shape against the SAME
      # broken definition; the first holds, the second is refuted.
      # Does each theorem actually CONSTRAIN the function it names? Each probe
      # refutes the generalized form with a concrete counterexample.
      - name: generalization probe -- decorative vs load-bearing
        working-directory: lean
        run: bash mutate/generalization_probe.sh

      - name: decorative-vs-load-bearing isolation
        working-directory: lean
        run: lake env lean mutate/decorative_isolation.lean

      - name: forbid native_decide
        working-directory: lean
        run: |
          if grep -rn 'native_decide' Proofs/*.lean; then
            echo "FAIL: native_decide trusts the compiler binary, not the kernel"; exit 1
          fi
          echo "PASS: no native_decide"

      # The kernel's own second opinion, independent of the elaborator that
      # produced the terms. Silence with exit 0 is the pass.
      - name: leanchecker -- kernel re-verification, with its negative control
        working-directory: lean
        run: |
          set +e
          for m in Proofs.RotGauge Proofs.RotRoute Proofs.RotInstall Proofs.RotPath Proofs.RotRemind Proofs.RotAcquire Proofs.RotVerdict Proofs.RotVacuity Proofs.RotMutant Proofs.RotLens Proofs.RotAbility; do
            lake env leanchecker "$m"; rc=$?
            echo "$m -> $rc"
            [ "$rc" -ne 0 ] && { echo "FAIL: kernel rejected $m"; exit 1; }
          done
          # NEGATIVE CONTROL: an instrument that cannot fail is decoration.
          lake env leanchecker Proofs.DeliberatelyAbsentModule; ctl=$?
          echo "control (absent module) -> $ctl"
          [ "$ctl" -eq 0 ] && { echo "FAIL: leanchecker passed a module that does not exist"; exit 1; }
          echo "PASS: all modules re-verified; the control failed as it must"

      - name: mutation suites -- theorems must DIE when the model breaks
        working-directory: lean
        run: |
          set -e
          bash mutate/mutate_rotgauge.sh
          bash mutate/mutate_rotroute.sh
          bash mutate/mutate_rotinstall.sh
          bash mutate/mutate_rotpath.sh
          bash mutate/mutate_rotremind.sh
          bash mutate/mutate_rotacquire.sh
          bash mutate/mutate_rotverdict.sh
          bash mutate/mutate_rotvacuity.sh
