#
# =============================================================================
# CI -- every gate, on a clean clone, on a machine that is not the author's.
#
# The point of this file is not "tests pass". It is that they pass somewhere
# with NO LOCAL STATE: no mathlib cache warmed by hand, no toolchain the author
# happens to have, no ~/.claude built up over months. A green here is the first
# evidence the packet works for someone else.
#
# TWO THINGS CI CAN DO THAT THE DEVELOPMENT MACHINE CANNOT, and they are the
# reason this is not just a duplicate run:
#
#   1. THE LOCALE TRAP. Measured on the dev machine: awk there formats %.2f in
#      the C locale REGARDLESS of LC_ALL, so the mutation that forces a
#      comma-decimal locale is INEXPRESSIBLE and is recorded as such -- not as
#      killed, not as survived. glibc awk on ubuntu DOES honour the locale, so
#      the trap can finally be expressed here.
#   2. THE TTY GUARD. The router must refuse to block when stdin is a terminal.
#      /dev/tty does not exist in the dev machine's non-interactive shell and
#      winpty needs a console it does not have, so the guard is UNTESTED there.
#      util-linux `script` gives a real pty here.
#
# A job that SKIPS a phase says so. A skip is never counted as a pass.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    # THE RELEASE LEVER. A bare dispatch is what it always was -- a full board
    # run that publishes nothing. Typing `release` here is the one act that
    # lets the release job at the bottom publish what this run proves; the law
    # "nothing is released until everything is green" is then enforced by
    # `needs:`, not by promise.
    inputs:
      publish:
        description: "type 'release' to cut the tag and publish this run's archives"
        required: false
        default: ""
  # Reusable: verify.yml calls this instead of duplicating every gate. Two
  # workflows running the same checks is two places for them to drift, and the
  # one that drifts is always the one nobody reads.
  workflow_call:

permissions:
  contents: read

concurrency:
  # `${{ github.workflow }}` IS LOAD-BEARING. Without it, verify.yml's
  # scheduled call shared this group with push runs: MEASURED 2026-08-17, the
  # Monday 06:00 UTC cron fired late at 07:01:52Z, its ci.yml call joined
  # `ci-refs/heads/main`, and cancel-in-progress KILLED the push run for
  # 925dd99 at the 43-minute mark -- a cancellation with no visible hand. The
  # re-run then cancelled the verify call right back, so BOTH verdicts were
  # lost to one shared group. With the workflow name in the group a push run
  # and a scheduled verify run coexist; a newer run still supersedes an older
  # run of its own kind, which is all the dedup that was ever wanted.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  checkers:
    name: checkers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one platform failing must not hide the other two
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full-freshness.sh CONTROL 3 needs git history to build the stale case

      - name: preflight -- what is available here
        shell: bash
        run: bash checker/preflight.sh

      # NO `if:`. A step guarded by `runner.os` SKIPS on the other two platforms,
      # and a skipped step is not a passed step -- it renders as "not red" while
      # having asserted nothing. This job therefore runs on every platform and
      # branches INSIDE, so its conclusion is `success` everywhere and the run
      # carries zero skips. `checker/ci-honesty.sh` enforces that; the law is
      # `no_step_may_skip` in lean/Proofs/RotGates.lean.
      - name: install comma-decimal locales
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo locale-gen de_DE.UTF-8 fr_FR.UTF-8
            sudo update-locale
            # Prove the trap is expressible HERE before relying on it below.
            echo "awk under de_DE.UTF-8: $(LC_ALL=de_DE.UTF-8 awk 'BEGIN{printf "%.2f", 0.09}')"
          else
            # NOT a silent no-op. State which platform this is and why nothing
            # was installed, so the log carries the reason rather than a gap.
            echo "RUNNER_OS=$RUNNER_OS: locale-gen is glibc-only; the comma-decimal"
            echo "trap is exercised on the Linux leg of this matrix. Nothing to install."
          fi

      # Required files present, and every count in the prose RECOUNTED from
      # source. A README that claims more theorems than exist is the project
      # lying about the one thing it sells.
      # The counter that every prose claim is checked against must itself be
      # able to fail: its selftest plants a theorem inside a doc comment and
      # requires it NOT to be counted.
      - name: theorem counter selftest
        shell: bash
        run: bash checker/count-theorems.sh --selftest

      - name: repo completeness + count drift
        shell: bash
        run: bash checker/repo-complete.sh

      - name: SPDX + copyright sweep
        shell: bash
        run: sh checker/spdx-sweep.sh

      - name: no machine-local paths
        shell: bash
        run: sh checker/no-local-paths.sh

      # EVERY `import` MUST MATCH THE FILE ON DISK EXACTLY, INCLUDING CASE.
      # This runner is Linux and resolves paths case-SENSITIVELY, so a wrong
      # case here is a hard build failure -- while on the Windows machine where
      # the tree is authored the compiler folds case and exits 0. Measured
      # 2026-08-09: 45 modules referenced `Proofs.RotMoE.` against a directory
      # named `Proofs/RotMoe/`, the build was green throughout, and leanchecker
      # could not resolve a single one of them.
      - name: lean module case (imports vs the real on-disk spelling)
        shell: bash
        run: sh checker/lean-module-case.sh

      # A LATENT defect: RotGauge and RotMutant both declared `RotMoE.classify`.
      # Nothing imported both, so all 61 gates were green while the shared Lean
      # tree -- whose aggregator imports every module -- could not build at all.
      # Two checkers had even grown comments calling per-module isolation "not
      # optional" BECAUSE of the clash, so a bug had begun to read like a design.
      # The check is general (any two modules, any qualified name), not a list of
      # today's names, and it found a second collision on its first run.
      - name: name collision (two modules, one qualified name)
        shell: bash
        run: bash checker/name-collision.sh

      # A per-module count in the prose was bound to nothing: README said
      # RotEigenform.lean had 101 theorems and 38 mutants when the source had
      # 115 and 41. repo-complete.sh binds the TOTALS, and the totals were
      # right -- the drift lived entirely inside one module's share of them.
      - name: module claims (per-module counts in the prose vs the source)
        shell: bash
        run: sh checker/module-claims.sh

      # Registered in the same commit that introduced the gate, because three
      # separate gates refused that commit until it was: workflow-lint (not run
      # by any workflow), gate-split (shell table vs Lean witness disagreed),
      # and the executable-bit sweep. An instrument nobody runs is the exact
      # defect this one reports, so shipping it unwired would have been the
      # reference indicting itself in its own first table -- which it did.
      - name: instrument encyclopedia (the gate reference vs the registry)
        shell: bash
        run: sh checker/encyclopedia.sh

      # R22. Ten gates run only under --full, which no commit and no push
      # triggers, so nothing recorded when they last ran. This step reads the
      # receipt a green full run leaves behind and refuses when it is missing or
      # describes a different tree. It is EXPECTED RED until the first real full
      # run stamps one -- that red is the finding, not a broken step, and the
      # four controls inside the gate prove it can also go green.
      #
      # continue-on-error mirrors gate-all.sh's own handling: the first full
      # run exits RED (the freshness gate is its own precondition) but is still
      # entitled to stamp the receipt. The step RUNS -- the gate executes, the
      # controls fire, the finding is in the log. It just does not block the
      # job, because a red that is the finding rather than a defect must not
      # prevent the run that records it.
      - name: FULL-only tier freshness (lean/Proofs/RotFreshness.lean)
        shell: bash
        continue-on-error: true
        run: |
          sh checker/full-freshness.sh || rc=$?; rc=${rc:-0}
          if [ "$rc" -ne 0 ]; then echo "::notice::full-freshness exit $rc -- EXPECTED RED until the first full run stamps a receipt"; exit 0; fi

      # Registered late: workflow-lint found this gate was in the shell table
      # and the Lean witness but in NO workflow, so CI had never run it once.
      # Exits 3 (SKIP) when no config dir is present, which is not a pass.
      # MEASURED 2026-08-12, at the first push that ran this step: it FAILED on
      # all three runners, and the cause was this wiring, not the checker. The
      # checker exits 3 (SKIP) when no Claude config dir exists; a CI runner has
      # no ~/.claude; and under `bash -e` an exit 3 is a failure. So the step
      # could NEVER be green here -- it was a check that only ever reported the
      # absence of the thing it wanted to inspect.
      #
      # Skipping it would be the fake green this repo forbids. Instead CI is
      # given a REAL config dir that declares this repository's own shipped
      # plugin root, and the checker inspects that. This is a genuine
      # measurement: if .claude-plugin/plugin.json were missing, or the declared
      # path did not resolve, or a marketplace were declared at two paths, the
      # checker fails exactly as it would on a developer's machine.
      - name: plugin root consistency (declared roots exist and agree)
        shell: bash
        run: |
          set -euo pipefail
          CFG="$RUNNER_TEMP/rotmoe-cfg/.claude"
          mkdir -p "$CFG"
          # The declaration under test points at THIS checkout, whose manifest
          # is the artifact we are about to publish.
          # MEASURED on the windows runner, run 31622038695: GITHUB_WORKSPACE is
          # a drive-letter path with backslash separators, and a lone backslash
          # is an ILLEGAL JSON
          # escape -- the checker read the file and reported
          #   FAIL UNPARSEABLE .../settings.json: Bad escaped character at position 118
          # which is the checker working correctly on a file this step wrote
          # wrongly. Forward slashes are valid on Windows and need no escaping.
          WS_JSON="${GITHUB_WORKSPACE//\\//}"
          printf '{\n  "extraKnownMarketplaces": {\n    "rot-moe": {\n      "source": {\n        "source": "directory",\n        "path": "%s"\n      }\n    }\n  }\n}\n' "$WS_JSON" > "$CFG/settings.json"
          # Prove the file we just wrote is parseable BEFORE handing it to the
          # checker, so a malformed fixture can never be mistaken for a finding
          # about the plugin roots.
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$CFG/settings.json" \
            || { echo "::error title=plugin-root::the fixture this step wrote is not valid JSON -- that is a defect in the step, not in the plugin roots"; cat "$CFG/settings.json"; exit 1; }
          test -s .claude-plugin/plugin.json || { echo "REFUSE: no plugin manifest to declare"; exit 1; }
          # `bash -e` aborts the step BEFORE `rc=$?` can be read -- measured in
          # run 30695224024 on the deferred-closure step below, and this block
          # had the identical bug when first written. An `if` makes the exit
          # status part of a compound command, which `-e` does not act on.
          if ROTMOE_CONFIG_DIRS="$CFG" bash checker/plugin-root-consistency.sh; then rc=0; else rc=$?; fi
          if [ "$rc" -eq 3 ]; then
            echo "::error title=plugin-root::checker reported exit 3 even with a config dir present -- the scratch dir was not seen, so nothing was inspected"
            exit 1
          fi
          exit "$rc"

      # The central structural claim, measured against the shipped router:
      # D1 totality, D2 conservation, D3 addition, D4 discrimination,
      # D5 determinism, D6 recomputability, D7 bounded cost. Each conjunct is
      # proved load-bearing in lean/Proofs/RotDominance.lean, and each was
      # verified killable by a deliberately broken router.
      - name: dominance (does the routing layer strictly extend the default loop?)
        shell: bash
        run: bash checker/dominance.sh

      # THE TRAP CORPUS AND ITS SCORING RULE. This does NOT re-run 120 live
      # turns -- that costs ~25 minutes and real money. It guards the parts that
      # rot in silence: that every corpus item is still a trap, that the scorer
      # still has the SYMMETRIC disadvantage branch (without it a routed loss is
      # filed as `null` again), and above all that the latency artifact on disk
      # is the ORDER-CONTROLLED one. A single-ordering artifact cannot attribute
      # the speedup -- RotOrdering.one_ordering_cannot_attribute proves that --
      # while the prose would still claim the router caused it.
      #
      # Verified killable 2026-08-10 by two deliberate breaks: deleting the
      # disadvantage branch (1 FAIL) and regenerating the artifact from one
      # ordering (3 FAILs). Restored to 15/0 after both.
      - name: trap corpus (all traps? scorer symmetric? latency order-controlled?)
        shell: bash
        run: bash checker/trap.sh

      # THE MUTATION HARNESS IS ITSELF AN INSTRUMENT, AND NOTHING CHECKED IT.
      #
      # Measured 2026-08-10: `MUT_ONLY=NOSUCHID` on 21 of the 37 filterable
      # suites ran ZERO mutants, printed "All 0 mutants killed", and exited 0.
      # Two copy-paste defects rode along: 8 suites extracted dead theorems from
      # `Proofs/RotTrap.lean` while mutating something else (the attribution
      # field was always empty), and 7 verified their baseline by rebuilding
      # `Proofs.RotOrdering` regardless of what they had mutated.
      #
      # Static sweep over every suite plus one live probe that RUNS a suite with
      # a filter matching nothing and asserts exit 3. Three negative controls
      # fire on a deliberately defective suite, so a silently broken regex
      # cannot report a clean sweep. Proved in lean/Proofs/RotSuiteVerdict.lean.
      - name: mutation harness integrity (a filtered suite must exit 3, never 0)
        shell: bash
        run: bash checker/mutate-harness.sh

      # THE DEBUG CHANNEL ITSELF. Every statistic this project quotes about lens
      # activity, lead share and R/s+ is read out of one JSONL file, and that
      # file was 8.2% unparseable (409 of 5000 lines) with nothing able to
      # notice. A writer killed mid-record left a line with no newline; the next
      # append fused two records into one and destroyed BOTH.
      #
      # This gate counts RECOVERED RECORDS, never corrupt lines. That is not a
      # style choice: RotLogAtomicity.corrupt_line_count_cannot_tell_them_apart
      # proves the broken and the repaired writer leave the SAME number of
      # corrupt lines, so a line-counting gate would have scored the repair as
      # worthless and passed the defect forever.
      #
      # It drives BOTH arms live against a deliberately truncated log --
      # PowerShell is present on the Windows runner, and on a runner without it
      # the behavioural half reports NOT RUN rather than claiming a pass.
      #
      # Verified killable 2026-08-10: removing the two awk-site guard calls gives
      # exit 1 with `repaired writer recovered 2, expected 3`; restored to 39/0.
      - name: debug-log integrity (records recovered, both writer arms run live)
        shell: bash
        run: bash checker/log-integrity.sh

      # THE P2.4 EXTRACTOR'S OWN CONTROLS. bench/work-trace.js reads the process
      # observables (verification steps, rework, reads-before-write, unsupported
      # claims) off a session transcript. It is registered as gate #54 in
      # checker/gate-all.sh -- but gate-all.sh is NOT invoked by this workflow,
      # CI runs checkers step by step, so without this step the gate would run
      # only in a pre-commit hook and never on a runner. That is precisely the
      # invisible-gate shape `no_trigger_never_escalates` is a theorem about.
      #
      # Every observable is controlled in BOTH directions -- one fixture that
      # must fire, one that must stay silent. The negative direction is the one
      # that matters: mutant W01 forced the verification predicate to accept
      # every command, and ONLY the "must stay silent" fixtures noticed (exit 1,
      # exactly 2 failures). A suite of positive fixtures alone would have
      # passed a detector that had been completely destroyed.
      - name: work-trace extractor controls (both directions, 16 fixtures)
        shell: bash
        run: node bench/work-trace.js --selftest

      - name: installer round trip (scratch config dir only)
        shell: bash
        run: bash checker/install-roundtrip.sh

      # THE TWO INSTALL PATHS MUST DELIVER THE SAME PRODUCT. Measured defect:
      # the plugin registered 5 hook bindings across 3 events while ARM_ROUTER
      # wrote 2 across 2, so a hand install silently lacked the whole proof
      # reminder. Every installer test in the repo passed throughout, because
      # each asserted things about the router -- which was present.
      - name: install parity (plugin registration vs ARM_ROUTER)
        shell: bash
        run: bash checker/install-parity.sh

      # DOES THE ROUTER BIND EVERY EVENT THE CLI DEFINES?
      # Added after the event list was found to be a LOWER BOUND: it had been
      # derived by counting which events other installed plugins used, which
      # cannot reveal an event nothing on the measuring machine binds. It missed
      # twenty of the thirty-one, SubagentStart among them.
      #
      # Phase A compares the manifest, both installer arms and the Lean spec
      # against checker/cli-hook-events.txt and needs no claude binary, so it
      # runs identically here and does NOT skip. Phase B re-extracts the array
      # from an installed CLI when one is present -- on a runner there is none,
      # and the checker says INAPPLICABLE rather than pretending to agree.
      - name: cli event coverage (manifest + installers + Lean vs the CLI)
        shell: bash
        run: bash checker/cli-event-coverage.sh

      # A HOOK WIRED TO AN EVENT MAY NOT SPEAK ON IT.
      # Measured live on 2026-08-09: with all 31 events wired, hooks that emit
      # hookSpecificOutput.additionalContext were doing so on events whose CLI
      # schema rejects it -- "Hook JSON output validation failed" roughly 25
      # times a session. Phases A/B are pure file reads and run everywhere;
      # phase C prints INAPPLICABLE where the user-profile hooks are absent,
      # which is a statement about the runner, not a skipped check. Phase D is
      # a self-control that fails the gate if the detector stops detecting.
      - name: context gate (no context emitted on a rejecting event)
        shell: bash
        run: bash checker/context-gate.sh

      # THE LOG IS THE ONLY CHANNEL THE ROUTER IS OBSERVABLE THROUGH, so the
      # thing that must not drift is the session scrubber: it puts a payload
      # value into a FILENAME. Phase B replays hostile ids through both arms and
      # compares against names pinned by #guard in the Lean module; phase C
      # enforces that every harness writing to the log declares itself, which is
      # what stops the instrument from contaminating its own measurement.
      - name: session log (scrubber, provenance, no traversal)
        shell: bash
        run: bash checker/session-log.sh

      # THE RELEASE ARTIFACTS, BUILT AND THEN INSTALLED FROM THE ZIP.
      # These two run in this order and only in this order: release-install.sh
      # REFUSES (exit 2) if the archives are not on disk, because installing a
      # stale artifact proves something about a tree nobody is shipping. That
      # already happened once here -- a zip built before a fix was tested after
      # it, and reported a defect that no longer existed.
      #
      # install-roundtrip.sh above proves the installer works IN THE REPOSITORY.
      # This proves it works the way a stranger meets it: unzipped somewhere with
      # no git, no checker/, no lean/ beside it.
      # MEASURED on windows-latest, run #20: `REFUSE: zip absent`, exit 2. The
      # Windows runner's Git Bash ships `unzip` but NOT `zip`. My own Git Bash
      # has zip installed, which is exactly why this never appeared locally --
      # a tool present on the development machine and absent on the runner is
      # invisible until the runner says so.
      #
      # The alternative was to skip packaging on Windows. Rejected: that would
      # also drop release-install.sh, which needs the archives and is the ONE
      # test that exercises the installer on the platform where path handling,
      # CRLF and the PowerShell arm actually differ. Provisioning one tool costs
      # less than losing that coverage.
      # NO `if:` -- see the locale step. Runs everywhere, branches inside, so the
      # conclusion is `success` on all three legs and nothing skips.
      - name: provide zip (Git Bash on Windows ships unzip only)
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne 'Windows') {
            "RUNNER_OS=$($env:RUNNER_OS): zip is present in the base image; nothing to install."
            # Still ASSERT it, rather than assuming. A step that reports success
            # without checking anything is the fake green this rule forbids.
            if (-not (Get-Command zip -ErrorAction SilentlyContinue)) {
              Write-Error "zip is absent on $($env:RUNNER_OS) -- packaging cannot run"
              exit 1
            }
            "zip verified present on $($env:RUNNER_OS)"
            exit 0
          }
          if (Get-Command zip -ErrorAction SilentlyContinue) {
            "zip already present"
          } else {
            # MEASURED FAILURE, run 31757025483: `choco install zip` failed on
            # windows-latest and took the entire checkers job with it -- 37 steps
            # skipped because a THIRD-PARTY PACKAGE REGISTRY was unavailable.
            # A release gate that goes red when chocolatey has a bad afternoon is
            # not measuring this repository.
            choco install zip -y --no-progress
            if ($LASTEXITCODE -ne 0) { "choco install zip FAILED (exit $LASTEXITCODE) -- falling back to 7-Zip" }
          }
          if (-not (Get-Command zip -ErrorAction SilentlyContinue)) {
            # FALLBACK: 7z is PREINSTALLED on windows-latest, so this needs no
            # network at all. The shim implements exactly the three invocation
            # shapes this repo uses -- `zip -q [-r] <archive> <path>...` -- and
            # REFUSES anything else rather than guessing. A shim that silently
            # mistranslates an unknown flag would produce a WRONG archive that
            # still passes its checksum, which is worse than no zip.
            $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue)
            if (-not $sevenZip) { Write-Error "neither zip nor 7z is available -- packaging cannot run"; exit 1 }
            $shimDir = Join-Path $env:RUNNER_TEMP "zipshim"
            New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
            # BUILT AS AN ARRAY, NOT A HERE-STRING. A PowerShell @'...'@ block
            # needs its body at column 0, which breaks straight out of this
            # YAML block scalar -- measured: `ci.yml` stopped parsing entirely
            # and workflow-lint caught it before it ever reached GitHub.
            $shimLines = @(
              '#!/usr/bin/env bash',
              '# zip shim over 7z. Accepts only: zip -q [-r] <archive> <path>...',
              'set -u',
              '# NO BASH ARRAY here, deliberately: workflow-lint R21 reads this',
              '# text as the step shell and cannot tell a written FILE from code,',
              '# so an array would trip it. Positional parameters do the same job.',
              'while [ $# -gt 0 ]; do',
              '  case "$1" in',
              '    -q|-r|-qr|-rq) shift ;;',
              '    -*) echo "zip-shim: unsupported flag $1 -- refusing rather than guessing" >&2; exit 2 ;;',
              '    *) break ;;',
              '  esac',
              'done',
              '[ $# -ge 2 ] || { echo "zip-shim: need <archive> and at least one path" >&2; exit 2; }',
              'archive="$1"; shift',
              '7z a -tzip -bso0 -bsp0 -- "$archive" "$@" >/dev/null || exit 1',
              '[ -s "$archive" ] || { echo "zip-shim: produced an EMPTY archive" >&2; exit 1; }',
              'exit 0'
            )
            $shim = ($shimLines -join "`n") + "`n"
            $shimPath = Join-Path $shimDir "zip"
            [System.IO.File]::WriteAllText($shimPath, ($shim -replace "`r`n", "`n"))
            "$shimDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$shimDir;$env:PATH"
            "zip shim installed at $shimPath (backed by 7z)"
            # PROVE THE SHIM WORKS before declaring the step green. A shim that
            # cannot make an archive must fail HERE, not in a checker later.
            $probe = Join-Path $env:RUNNER_TEMP "shim-probe"
            New-Item -ItemType Directory -Force -Path $probe | Out-Null
            "probe" | Out-File (Join-Path $probe "a.txt")
            bash -c "cd '$($probe -replace '\\','/')' && zip -q -r probe.zip a.txt"
            if (-not (Test-Path (Join-Path $probe "probe.zip"))) {
              Write-Error "the zip shim did not produce an archive -- packaging cannot run"; exit 1
            }
            "zip shim verified: it produced a real archive"
          }
          # Fail loudly here rather than as a REFUSE three steps later.
          if (-not (Get-Command zip -ErrorAction SilentlyContinue)) {
            Write-Error "zip is still absent after install -- packaging cannot run"
            exit 1
          }

      # MEASURED on macos-latest, CI #23, from the checker's own "bounded by:"
      # line: the macOS runner has NEITHER `timeout` NOR `gtimeout`. Windows
      # prints "bounded by: timeout"; macOS printed
      #     bounded by: <NONE -- neither timeout nor gtimeout; calls are UNBOUNDED>
      #
      # The checkers degrade honestly (they announce it and still run), but one
      # assertion goes DEAD: checker/hook-footprint.sh detects a hung hook by
      # exit code 124, which only a bound can produce. Unbounded, a hang would
      # not be reported -- it would stall the job until the runner's own limit.
      # A hang test that cannot observe a hang is decoration, so the tool gets
      # provisioned rather than the assertion quietly weakened.
      #
      # coreutils installs it as `gtimeout`, which the run_bounded chain in the
      # checkers already prefers over nothing.
      # NO `if:` -- see the locale step. The body below is already a pure
      # capability test ("is a bound available? if not, write a shim"), so it is
      # correct and meaningful on every platform: it now ASSERTS on Linux and
      # Windows that a bound exists rather than skipping and assuming one does.
      - name: provide a bound (gtimeout/timeout must exist on every runner)
        shell: bash
        run: |
          # WAS: `brew install coreutils`. It works, but Homebrew emits its tap-trust
          # notice as a GITHUB WARNING ANNOTATION on this runner image, and the
          # deferred-closure gate requires ZERO warning annotations across the run. That
          # gate is right and I am not weakening it: it is what catches a deprecated
          # action. Measured: run 30741381885 carried exactly 2 warning logs, both this.
          #
          # Silencing the annotation (unsetting GITHUB_ACTIONS so brew prints plain text)
          # would have passed the gate while changing nothing real -- that is gaming an
          # alarm, not fixing a defect. The honest fix is to stop needing Homebrew: all
          # this step ever wanted was a BOUND, and a bound is ten lines of bash. No
          # package manager, no network, no third-party output to annotate.
          if command -v gtimeout >/dev/null 2>&1 || command -v timeout >/dev/null 2>&1; then
            echo "a bound is already available"
          else
            mkdir -p "$HOME/bin"
            cat > "$HOME/bin/timeout" <<'SHIM'
          #!/bin/bash
          # Minimal GNU-timeout substitute: run the command, kill it after N seconds,
          # and report 124 on timeout exactly as GNU timeout does -- 124 is the value
          # checker/hook-footprint.sh looks for to detect a hang.
          d="$1"; shift
          # STDIN MUST SURVIVE. bash redirects an asynchronous command's stdin from
          # /dev/null when job control is off, so `"$@" &` silently starves anything
          # that reads a prompt -- the router got nothing, produced no route, and the
          # step burned the full bound before failing. Measured: run on 43b3368, macOS,
          # four checks each taking exactly 60s. Saving fd 0 and feeding it back
          # explicitly defeats that redirect.
          # Verified locally: `echo hello | shim 5 cat` prints nothing without this
          # line and prints hello with it, while 124/1/0 stay correct.
          exec 3<&0
          "$@" <&3 & p=$!
          ( sleep "$d"; kill -9 "$p" 2>/dev/null ) & w=$!
          # The braces+redirect suppress bash's own "Killed" job notice, which would
          # otherwise land in the stderr a caller captures. Measured locally: without
          # it the timeout case prints a job line; with it stderr is empty.
          { wait "$p"; rc=$?; } 2>/dev/null
          kill "$w" 2>/dev/null
          if [ "$rc" -ge 128 ]; then rc=124; fi
          exit "$rc"
          SHIM
            sed -i '' 's/^          //' "$HOME/bin/timeout" 2>/dev/null || sed -i 's/^          //' "$HOME/bin/timeout"
            chmod +x "$HOME/bin/timeout"
            echo "$HOME/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/bin:$PATH"
          fi
          # Fail here, loudly, rather than letting a hang check silently rot.
          command -v gtimeout >/dev/null 2>&1 || command -v timeout >/dev/null 2>&1 \
            || { echo "no bound available -- hang detection would be dead"; exit 1; }
          # SELF-TEST, both directions -- an unverified shim is worse than no shim.
          BOUND=$(command -v gtimeout 2>/dev/null || command -v timeout)
          # This runner's shell is `bash -e -o pipefail`, so a command that EXITS NON-ZERO
          # ON PURPOSE aborts the step before its status can be read. The timeout probe is
          # exactly that: it must return 124, and under -e it killed the step at 124 before
          # `rc_slow=$?` ever ran. Measured: run on 857c06a, macOS job, exit code 124.
          # My local check passed because a plain interactive bash has no -e -- the local
          # instrument did not reproduce the runner's shell, which is the whole defect.
          rc_fast=0; "$BOUND" 5 true    || rc_fast=$?
          rc_slow=0; "$BOUND" 1 sleep 9 || rc_slow=$?
          echo "bound: $BOUND   quick-command rc=$rc_fast   timed-out rc=$rc_slow"
          [ "$rc_fast" -eq 0 ]   || { echo "bound broke a command that should pass"; exit 1; }
          [ "$rc_slow" -eq 124 ] || { echo "bound did not report 124 on timeout"; exit 1; }

      - name: release artifacts build, and assert their own contents
        shell: bash
        run: bash checker/release-package.sh

      - name: release artifacts install from the zip (scratch config dir only)
        shell: bash
        run: bash checker/release-install.sh

      # The local-only 1.0.x build, run HERE rather than exempted. On my machine
      # it proves the artifacts regenerate; in CI it proves something I cannot
      # prove locally -- that they regenerate on a checkout that is not mine,
      # from `git archive HEAD` alone, with no untracked file quietly supplying
      # a missing piece. It packages twice on purpose: the second pass is the
      # reproducibility comparison, not a retry.
      # REMOVED 2026-08-08, and the removal is the actual repair.
      #
      # This step ran checker/release-local.sh on all three runners and it had
      # been failing on macOS-latest for three consecutive runs, taking 28
      # subsequent steps down as skipped with it. The BSD `sed -i` incompatibility
      # was the symptom. The DEFECT was putting the step here at all.
      #
      # R23 builds a .gitignore'd `.release-local-only/` from HEAD and installs it
      # into the local test config dir so an UNPUBLISHED release can be
      # rehearsed before the completion promise is earned. A GitHub runner has no
      # CTT, and the artifact is by construction never published, so the step was
      # asserting a local rehearsal on a machine that cannot host it. The comment
      # that used to sit here claimed CI "proves something I cannot prove
      # locally"; what it actually proved was that the runner is not this machine.
      #
      # The gate is NOT deleted and NOT weakened -- it runs in the local deep tier
      # via checker/gate-all.sh, where the prerequisites exist, and it passes
      # there (11 passed, 0 failed). checker/workflow-lint.sh now carries it as a
      # named exemption whose reachability from gate-all.sh is asserted, so it
      # cannot quietly stop running.
      #
      # The portability repairs stay: a macOS contributor running the deep tier
      # locally needs them, and checker/portability.sh section 6b now catches
      # both constructs repo-wide.

      # The Lean witness uses the SHIPPING weights on purpose, so the proofs
      # apply to the profile in production. Retune LAMBDAS and every other gate
      # stays green while "proved for the shipping profile" quietly goes false.
      - name: Lean witness must match the shipped weights
        shell: bash
        run: bash checker/lean-binds-shell.sh

      - name: cross-diff -- both router arms + locale invariance
        shell: bash
        run: bash checker/cross-diff.sh

      # The router's own debug channel, against lean/Proofs/RotDebugLog.lean.
      # Runs on all three OSes because the failure it guards is filesystem
      # behaviour -- an unwritable path -- and that is exactly the kind of thing
      # that differs between Windows, Linux and macOS. Both arms are exercised
      # wherever pwsh exists; where it does not, the ps1 arm is reported as a
      # SKIP and never as a pass.
      - name: debug channel -- a lost record must be MARKED, and the log bounded
        run: bash checker/debug-channel.sh

      # Organ 4 has two arms for the same reason the router does, so it gets the
      # same instrument. The runner has PowerShell, so this is a real comparison
      # here rather than the POSIX-only degraded mode.
      - name: cross-diff -- both reminder arms (organ 4)
        shell: bash
        run: bash checker/cross-diff-remind.sh

      # ---------------------------------------------------------------------
      # THE FOUR GATES ADDED IN 0.7.0. Every one of them guards a defect that
      # had ALREADY REACHED A LIVE MACHINE while 29 gates were green, which is
      # the only argument for adding a gate that carries any weight.
      #
      #   duplication   -- the plugin and ARM_ROUTER both register the router on
      #                    the same two events, so the documented install made it
      #                    fire TWICE on every prompt.
      #   disarm safety -- `--dry-run` was accepted, ignored, and deleted live
      #                    hook entries; removal could not reach a plugin-path
      #                    entry at all.
      #   remind measure-- the proof scan was one level deep in BOTH arms, and
      #                    the workspace chain had a step nothing ever wrote.
      #   log replay    -- the debug log was written by both arms and read by
      #                    nothing, so its numbers could drift unobserved.
      #
      # They sit in the `checkers` job, which is a matrix over ubuntu-latest,
      # windows-latest and macos-latest, so all four run on all three. That is
      # not incidental: three of them compare the POSIX arm against the
      # PowerShell arm, and a cross-arm gate that only ever runs on one OS is a
      # gate for one OS. Each degrades to an explicit SKIP -- never a PASS -- if
      # pwsh is missing from a runner.
      - name: router duplication -- the plugin and ARM_ROUTER must not stack
        shell: bash
        run: bash checker/router-duplication.sh

      - name: disarm safety -- a dry run writes nothing, --all reaches plugin entries
        shell: bash
        run: bash checker/disarm-safety.sh

      - name: remind measure -- both arms, one tree, including a nested proof
        shell: bash
        run: bash checker/remind-measure.sh

      # A TIMEOUT IS NOT A REJECTION, and until 2026-08-14 nothing checked that
      # the code enforcing it actually did. The demotion compared a whole reason
      # string to "TIMEOUT" while the producer writes "TIMEOUT after 90s", so it
      # never fired -- and no existing checker could see it, because `--decide`
      # is fed the already-classified list and cross-diff only proves the two
      # arms AGREE (they agreed on being wrong).
      - name: kernel verdict class -- a non-answer is not a rejection
        shell: bash
        run: bash checker/kernel-verdict-class.sh

      - name: log replay -- every gauge record recomputed from its own fields
        shell: bash
        run: bash checker/log-replay.sh

      # AGENT_SETUP.md and /rot-moe-install are instructions to an AGENT WITH A
      # SHELL. A stale path in them is not a documentation nit -- it is an
      # agent improvising on someone else's machine.
      - name: install-document lint -- the agent-facing docs cannot go stale
        shell: bash
        run: bash checker/claude-md-lint.sh

      # The architecture blueprint is proprietary; this tree is copyleft. The
      # bridge between them must describe the evidence that EXISTS -- and must
      # stop hedging the day the written grant is filed.
      - name: licence bridge -- NOTICE.md must match what is on disk
        shell: bash
        run: bash checker/license-bridge.sh

      # tag-manager.yml owns the invariants that need the API (the evidence
      # scan). These are the ones that need nothing at all, so they run on
      # every commit and, crucially, on a machine with no remote.
      - name: release consistency -- version, tag and date cannot disagree
        shell: bash
        run: bash checker/release-consistency.sh

      - name: tag consistency -- tags.txt, README and CITATION cannot drift
        shell: bash
        run: bash checker/tags-consistency.sh

      # verify.yml commits STATUS.md "only when the verdict changed". Until
      # 2026-08-01 it wrote `date -u` and ${GITHUB_SHA} INTO the file it then
      # compared, so the silent branch was unreachable and the weekly job would
      # have committed forever -- the green-square behaviour its own comment
      # forbids. These two hold the fixed design: the first structurally, the
      # second by RUNNING verify.yml's own `run:` blocks for three weeks
      # against a scratch bare remote and counting the commits that land.
      - name: verdict stability -- the scheduled commit rule can say nothing
        shell: bash
        run: bash checker/verdict-stability.sh

      # Fast, and deliberately SEPARATE from the three-week simulation below.
      # The simulation is slow, so it sits in gate-all's FULL set, which CI runs
      # and a developer usually does not -- and that gap shipped a STATUS.md
      # claiming 154 theorems against 162 in the sources. All three OS legs then
      # failed at once on a tree whose local sweep was green. This runs in under
      # a second, so it is in the DEFAULT local set too: every check CI can fail,
      # the default local sweep must be able to fail.
      - name: verdict freshness -- is the committed STATUS.md true of this tree
        shell: bash
        run: bash checker/verdict-fresh.sh

      # The README's counts, recomputed from the tree. Same reasoning as the
      # verdict block directly above: a number typed into prose is true on the
      # day it is written and silently false afterwards. Both are in the default
      # local set as well, because a check CI can fail that the local sweep
      # cannot is a local sweep that lies about being green.
      - name: README FACTS block -- the published counts against the tree
        shell: bash
        run: bash checker/facts-block.sh

      # `rc=$?` after a bare command is DEAD CODE under GitHub's `bash -e {0}`.
      # Three steps in this very file carried that shape, and their carefully
      # written tolerance branches had never once executed. This gate scans the
      # workflows so a fourth cannot appear.
      - name: workflow exit reads -- every $? must actually be reachable
        shell: bash
        run: bash checker/workflow-exit-reads.sh

      # A tracked file emptied on disk is INVISIBLE to every text-reading check,
      # because the offending text is exactly what was deleted. Measured
      # 2026-08-10: an interrupted mutation harness left two shipped hooks at
      # zero bytes and the only gate that reacted blamed a CRLF regression that
      # did not exist. Proved in lean/Proofs/RotTreeIntegrity.lean.
      - name: tree integrity -- no tracked file is EMPTY while git holds content
        shell: bash
        run: bash checker/tree-integrity.sh

      - name: scheduled verdict, three weeks with a real (local) remote
        shell: bash
        run: bash checker/verdict-schedule-sim.sh

      # THIS STEP USED TO BE `gauge-cross.sh`, AND IT COULD ONLY EVER SKIP.
      #
      # gauge-cross needs a built Lean workspace. This job has none, so the step
      # printed "SKIPPED: no built Lean workspace -- NOT a pass" and exited 0 on
      # ubuntu, macos AND windows, every single run. The label was honest and the
      # step was still a hole: it had NO REACHABLE PASS. A step that cannot pass
      # cannot fail either, and three of those in a green run are three lies of
      # omission. Found by reading the run's log.zip.
      #
      # Not repaired by deleting it, and not by installing a mathlib toolchain on
      # three platforms to recompute a platform-INDEPENDENT number. The two arms
      # are split by what they actually depend on:
      #
      #   * the LEAN arm is the same .olean and the same Float on every runner,
      #     so the `lean` job verifies Lean == hook == corpus, once, where a skip
      #     is already a hard failure;
      #   * the HOOK arm is awk in a POSIX shell and is emphatically NOT
      #     platform-independent -- a decimal-comma locale turning 0.49 into 0,49
      #     is a failure mode this repository has already been bitten by, which
      #     is why the locale step above exists.
      #
      # So this runs the HOOK against checker/gauge-corpus.tsv, whose expected
      # values the lean job re-derives from Lean and FAILS on if they drift.
      # There is no exit 3 in that checker: it has no reason to skip and is not
      # given one.
      - name: gauge hook corpus -- the running hook vs the Lean-verified values
        shell: bash
        run: bash checker/gauge-hook-corpus.sh

      # A HOOK WITH NO DECLARED TIMEOUT IS KILLED AT 30 s AND CONTRIBUTES
      # NOTHING -- no marker, no lane, no gauge. Measured 2026-08-07: neither
      # install path declared one, so the router was being silenced on real
      # prompts and the only trace was in the debug view. This asserts the bound
      # is declared, exceeds the default it replaces, and is IDENTICAL on both
      # install paths. It never pins a particular number, so the value may move
      # without editing the check.
      - name: hook timeout -- declared, adequate, same on both install paths
        shell: bash
        run: bash checker/hook-timeout.sh

      # The three lane profiles in RotAbility.lean (creativeLam, empathicLam,
      # predictiveLam) are TRANSCRIBED from engine/rot-lean.md §4. Until
      # 2026-08-03 nothing bound them: the router never executes a lane profile,
      # so the spec could be retuned and the theorems would keep proving things
      # about numbers nobody ships. This is pure text-vs-text and needs no Lean
      # workspace, so it never skips.
      # The A/B figures the CHANGELOG publishes are re-derived here from the
      # committed per-turn corpus. No credential and no session: the collector
      # (bench/ab-session.sh) needs those, the audit does not. If a published
      # mean, delta or sign count drifts from the corpus, this step fails.
      - name: A/B corpus -- published figures re-derived from bench/ab-metrics.jsonl
        run: bash checker/ab-analyze.sh
      # The instruction-compliance endpoint. Unlike the step above it needs the
      # RAW transcripts, which are not committed, so on a runner it exits 3 and
      # says why. That is a SKIP and it is visible as one -- the step still runs,
      # so a scorer that stops working is caught here rather than never.
      # Locally, where the corpus exists, it asserts every published figure in
      # BOTH directions, including that the de-confounded correction stays
      # attached to the headline.
      - name: A/B instruction compliance -- exit 3 SKIP without the raw corpus
        shell: bash
        run: |
          # `|| rc=$?` IS LOAD-BEARING, and the bare form was the defect.
          #
          # MEASURED on run 31272071528, job 93139618870: this gate printed its
          # SKIP banner correctly -- "Exit 3 is a SKIP, never a pass" -- and the
          # step still failed with "##[error]Process completed with exit code 3".
          # The exit-3 branch below never executed.
          #
          # The reason is that GitHub runs `shell: bash` as
          # `bash --noprofile --norc -eo pipefail`. Under `set -e` a command
          # returning non-zero terminates the script AT THAT LINE, so `rc=$?` on
          # the next line is never reached. The handling looked present in the
          # file and was dead on the runner.
          #
          # This cost all four jobs: the step failed, and 28 steps after it were
          # SKIPPED as a consequence -- which is why three runs in a row showed
          # a large skip count that had nothing to do with the checkers
          # themselves.
          #
          # `|| rc=$?` keeps `set -e` satisfied while reading the code DIRECTLY,
          # which is the same rule this repo applies everywhere: nothing may run
          # between the command and the read of its status. Exit 3 and ONLY exit
          # 3 is a skip; every other non-zero still fails the job.
          rc=0
          bash checker/ab-compliance.sh || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "SKIPPED BY DESIGN: raw A/B transcripts are not committed (exit 3)."
            exit 0
          fi
          exit "$rc"
      - name: profile binding -- Lean lane tables vs the spec they came from
        shell: bash
        run: bash checker/profile-bind.sh

      - name: mutate the checker -- it must be able to fail
        shell: bash
        run: bash checker/mutate-checker.sh

      # INSTALL THE CLI SO THE CLI-GATED CHECKERS RUN INSTEAD OF SKIPPING.
      #
      # Measured on run 31092203143: `plugin-install.sh` and
      # `live-session-smoke.sh` printed "SKIPPED: claude CLI absent -- NOT a
      # pass" on ALL THREE runners -- six skipped checkers in one green run.
      # `checker/live-session-smoke.sh:57` meanwhile tells its reader:
      #
      #     "This is a SKIP, not a PASS: the packet is unproven in a live
      #      session on this machine. CI installs the CLI and runs it there."
      #
      # CI did not. A comment that promises coverage which does not exist is
      # worse than no comment, because it stops anyone from looking.
      #
      # Neither checker needs credentials. `plugin-install.sh` was measured at
      # exit 0 with the CLI present and no auth at all, and
      # `live-session-smoke.sh:215` already skips ONLY its credential phase,
      # by name, while still running ARM_ROUTER, DISARM_ROUTER and the rest.
      - name: install the claude CLI -- the CLI-gated checkers must RUN
        shell: bash
        run: |
          set +e
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          if ! command -v claude >/dev/null 2>&1; then
            echo "::error::the claude CLI did not install. The CLI-gated checkers"
            echo "::error::would SKIP, and a skip is never a pass -- failing instead."
            exit 1
          fi
          echo "claude CLI: $(claude --version)"

      # No longer skippable: the step above guarantees the CLI, so an exit 3
      # here means the guard itself broke and must be seen, not absorbed.
      - name: plugin + fresh-user install (MUST run -- the CLI is installed)
        shell: bash
        run: |
          set +e
          bash checker/plugin-install.sh; rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::plugin-install.sh reported the CLI absent AFTER the install"
            echo "::error::step succeeded. That is a broken guard, not a skip."
            exit 1
          fi
          exit $rc

      # Catches a checker that CI never runs -- the repo would look more
      # verified than it is, with a green tick saying nothing about it.
      # NOT run here on purpose: ci-dryrun.sh executes THIS workflow's own step
      # list in a clean clone, so running it inside the workflow would recurse.
      # It is a --full gate locally, which is where a step-list defect must be
      # caught -- before the push, not by it.

      - name: workflow lint -- parse + drift
        shell: bash
        run: bash checker/workflow-lint.sh

      # The README told three tiers to download `rot-moe-0.5.x-*.zip` while the
      # packager built `0.7.x` -- for two minor versions, with every gate green.
      # A dead download link is the first instruction a new reader follows, so it
      # fails earlier and louder than any wrong number in a table would.
      - name: README download links name archives the packager builds
        shell: bash
        run: bash checker/readme-variants.sh

      - name: live-session smoke (MUST run -- the CLI is installed)
        shell: bash
        run: |
          set +e
          bash checker/live-session-smoke.sh; rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::live-session-smoke.sh reported the CLI absent AFTER the"
            echo "::error::install step succeeded. Broken guard, not a skip."
            exit 1
          fi
          exit $rc

      # The marketplace install path, in the ONLY jobs that can reach it. The
      # lean job registers the same checker but has no CLI, so there it can
      # only ever skip -- and until run 31187881399 it skipped while the log
      # blamed missing credentials, a cause that had not been tested.
      #
      # Here the CLI IS installed a few steps above, so exit 4 ("no claude CLI")
      # cannot be a fact about the environment: it means the install step
      # silently produced nothing. That is a FAILURE, exactly as the sibling
      # rule for live-session-smoke treats its own 3.
      #
      # Exit 3 remains a skip on this runner and always will: credentials are a
      # decided boundary (see the note in the lean job), enforced locally with
      # `gate-all --full` and in the CTT instance before anything ships.
      - name: marketplace session -- CLI present, so "no CLI" is a FAILURE
        shell: bash
        run: |
          set +e
          bash checker/marketplace-session.sh; rc=$?
          if [ "$rc" -eq 4 ]; then
            echo "::error::marketplace-session.sh reports the CLI absent AFTER the"
            echo "::error::install step succeeded. Broken install, not a skip."
            exit 1
          fi
          if [ "$rc" -eq 3 ]; then
            echo "SKIP (3): no credentials on the runner -- never counted as a pass"
            exit 0
          fi
          exit $rc

      # THIS ONE DOES RUN HERE, and the distinction is the point of the note
      # below. `ctt-session.sh --report` does not hold a session -- it ANALYSES
      # the committed corpus in bench/, which is the evidence behind the
      # benchmark table in README.md. No claude CLI, no credential, nothing that
      # forces a permanent SKIP. If the corpus is ever replaced by one whose
      # gauge records do not recompute, or that drops a lens, or that covers too
      # few lanes, this step goes red on a public runner.
      - name: CTT session report -- re-derive the README numbers from the corpus
        shell: bash
        run: bash checker/ctt-session.sh --report

      # DELIBERATELY NOT RUN HERE: checker/release-session.sh and
      # checker/release-longsession.sh.
      #
      # I added both as workflow steps and then removed them, because a step that
      # can NEVER do its job still paints a green check. Both need the `claude`
      # CLI, and the sustained one additionally needs a credential to clone. A
      # public GitHub runner has neither and never will, so both would report
      # "SKIPPED" on every run for the life of the repository -- a permanent
      # green tick measuring nothing. The exit-3 convention is honest inside the
      # gate; it is NOT honest as a CI step that is guaranteed to take it.
      #
      # They are --full gates in checker/gate-all.sh, which runs where a real
      # session is possible. That is the only place their green means anything,
      # and their results are reported by hand with the turn counts.
      #
      # SAME PROPERTY, PRE-EXISTING, RECORDED RATHER THAN HIDDEN: the
      # "plugin + fresh-user install" and "live-session smoke" steps above USED
      # TO skip on every public runner for the same reason. That was fixed on
      # 2026-08-06 by installing the CLI in this job: both now RUN, and an
      # exit 3 from either is treated as a broken guard and fails the build.
      #
      # What still cannot run anywhere but a credentialed machine is the LIVE
      # TURN itself. `live-session-smoke.sh:215` skips that one phase by name
      # while executing everything around it, so its green now means "the
      # install, ARM_ROUTER and DISARM_ROUTER were exercised" -- which is a
      # great deal more than it meant when the whole script was skipped.

      # The guard the development machine cannot test. `script` allocates a real
      # pty, so stdin IS a terminal and the router must refuse rather than block.
      # Bounded by timeout: a hang here is the exact failure being tested for,
      # and an unbounded hang reports nothing.
      # NO `if:`. This is a VERIFY step, not provisioning -- the kind whose skip
      # is a coverage hole rather than a courtesy. It was scoped to Linux because
      # GNU `script -q -e -c` is the only pty allocator on that image; the other
      # two legs asserted NOTHING about the router's tty behaviour and still
      # reported not-red. It now runs on all three, choosing the pty allocator
      # available on each and REFUSING if none is, so the coverage is real
      # everywhere or the run goes red.
      - name: tty guard -- pty refusal where a pty exists, non-blocking everywhere
        shell: bash
        run: |
          set +e
          bound () { if command -v timeout >/dev/null 2>&1; then timeout "$@";
                     elif command -v gtimeout >/dev/null 2>&1; then gtimeout "$@";
                     else echo "FAIL: no bound available; a hang would report nothing"; exit 1; fi; }
          if script -q -e -c 'true' /dev/null >/dev/null 2>&1; then
            # GNU script (Linux): -c takes the command, the file comes last.
            ALLOC="GNU script"; echo "pty allocator: $ALLOC"
            bound 15 script -q -e -c 'sh hooks/rot-router.sh' /dev/null > tty.out 2>&1
          elif script -q /dev/null true >/dev/null 2>&1; then
            # BSD script (macOS): the file comes first, then the command.
            ALLOC="BSD script"; echo "pty allocator: $ALLOC"
            bound 15 script -q /dev/null sh hooks/rot-router.sh > tty.out 2>&1
          else
            ALLOC="none"; echo "pty allocator: none on $RUNNER_OS"
            # MEASURED, and the first attempt here was WRONG in a way worth
            # recording. Git Bash ships `winpty`, but winpty needs a real console
            # and a CI runner has none: it dies with
            #   ASSERT_CONDITION("wp != nullptr && cols > 0 && rows > 0")
            # So a genuine pty is IMPOSSIBLE on this leg -- not inconvenient,
            # impossible.
            #
            # The first version pretended otherwise: it fed the router /dev/null
            # and asserted `rc != 0`, "the same contract". It is NOT the same
            # contract. Empty stdin is not a terminal, and the router correctly
            # exits 0 on it (measured: exit 0, zero bytes). That assertion was
            # false and it turned run 31045719329's Windows job RED -- which is
            # the system working: a wrong check failed loudly instead of passing
            # quietly.
            #
            # What IS assertable here is the weaker but real property, and it is
            # named as weaker rather than dressed up as the pty check: on empty
            # stdin the router must terminate, must not hang, and must emit
            # nothing. That catches a hang and catches stray output; it does not
            # catch tty-blocking, and the log says so on this leg.
            NO_PTY=1
            bound 15 sh hooks/rot-router.sh < /dev/null > tty.out 2>&1
          fi
          rc=$?
          # EXHAUSTIVENESS GUARD -- added after this very block shipped broken.
          # An edit removed the `else` keyword, so on Windows NEITHER branch ran:
          # `rc` was the exit of the failed `elif` TEST (0), `tty.out` was never
          # created, and the step fell through to the pty assertions. Worse, on
          # macOS the fallback ran AFTER the real pty probe and overwrote its
          # result -- a leg that reported PASS while asserting nothing about a
          # terminal. A dispatch that silently selects NO branch is the same
          # defect as a skipped step, wearing a different hat.
          #
          # So each branch now names itself and the absence of a name is fatal.
          if [ -z "${ALLOC:-}" ]; then
            echo "FAIL: no pty-allocator branch ran -- the dispatch is not exhaustive."
            echo "      Nothing was asserted. This is a skipped check, not a pass."
            exit 1
          fi
          if [ ! -f tty.out ]; then
            echo "FAIL: allocator '$ALLOC' selected but tty.out was never created."
            exit 1
          fi
          echo "allocator=$ALLOC"
          echo "exit=$rc"; cat tty.out
          if [ "$rc" -eq 124 ]; then echo "FAIL: the router BLOCKED (no bound reached)"; exit 1; fi
          if [ "${NO_PTY:-0}" = "1" ]; then
            # Narrower leg, stated plainly.
            if [ "$rc" -ne 0 ]; then
              echo "FAIL: empty stdin must be a clean no-op, got exit $rc"; exit 1; fi
            if [ -s tty.out ]; then
              echo "FAIL: empty stdin produced output; the router must stay silent"; exit 1; fi
            echo "PASS: no pty on $RUNNER_OS -- asserted the NON-BLOCKING + silent-on-empty"
            echo "      contract instead. The tty-refusal itself is covered on the Linux"
            echo "      and macOS legs of this same matrix, which DO allocate a pty."
            exit 0
          fi
          if [ "$rc" -eq 0 ]; then echo "FAIL: the router accepted a tty as hook input"; exit 1; fi
          grep -qi 'expects a JSON payload on stdin' tty.out \
            && echo "PASS: refused a terminal with the documented message" \
            || { echo "FAIL: refused, but not for the documented reason"; exit 1; }

  # ---------------------------------------------------------------------------
  # RELEASE -- published by the run that proved the tree, or not at all.
  #
  # RELEASE.md states the law: "Nothing is released until everything is green."
  # Until 6.0.0 a human enforced it by hand -- wait for the board, cut the tag,
  # build the archives on one machine, upload them from another -- and every
  # step of that chain is a place for the law to be broken politely.
  #
  # This job closes the gap STRUCTURALLY. `needs:` makes publication
  # unreachable unless every checker job succeeded in THIS run on THIS commit:
  # proof and publication share a SHA by construction, not by promise. The
  # Lean lane (build, axioms, kernel re-check) lives in ci2.yml since
  # 2026-08-29 (operator decision): it fires on the same push and lands in
  # parallel, and release does NOT wait on it -- a red ci2 is inspected after
  # the fact. "Everything is green" here means every job THIS workflow runs. The archives are rebuilt here by the same
  # asserting packager the checkers job just exercised, so what lands on the
  # Releases page is what checker/release-package.sh swore to, with its
  # checksums beside it.
  #
  # It runs on every trigger and BRANCHES INSIDE (`no_step_may_skip`,
  # lean/Proofs/RotGates.lean): an ordinary run rehearses the packaging and
  # publishes nothing; only an explicit workflow_dispatch that typed
  # `publish=release` reaches the publishing half. A tag that already exists on
  # another commit, or a Release that already exists at all, is a REFUSAL --
  # docs/GIT-WORKFLOW.md 4.3: a tag with a Release attached never moves.
  release:
    name: release -- publish only what this run proved
    runs-on: ubuntu-latest
    needs: [checkers]
    permissions:
      # Job-scoped, and the reason is stated because workflow-roles.sh demands
      # it: write exists only to commit the release -- the v* tag ref and the
      # archive assets on the Releases page. No step of this job pushes to any
      # branch, and workflow-lint.sh phase 1c holds the whole file to that.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: release archives rebuilt in the publishing job's own workspace
        shell: bash
        run: bash checker/release-package.sh

      - name: publish -- three tags, one body, three archives
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ASK: ${{ github.event.inputs.publish }}
        run: |
          set -e
          # THE SHAPE, stated once: three tags cut from ONE commit. They differ
          # by the archive each carries, not by source tree. v$BASE.0 Router,
          # v$BASE.1 Lean, v$BASE.2 Lean+Extra -- the same digits
          # checker/release-package.sh stamps into each zip.
          #
          # No backslash escape appears anywhere in this step, deliberately. The
          # awk field split below needs none, and a backslash that goes missing
          # turns a regex into a character class that matches nothing while
          # still exiting 0. Field 4 of a quote-split `"version": "9.0.1",` is
          # the version.
          VER=$(awk -F'"' '/"version"/{print $4; exit}' .claude-plugin/plugin.json)
          BASE=${VER%.*}
          [ -n "$BASE" ] || { echo "FAIL: unreadable version in .claude-plugin/plugin.json"; exit 1; }

          # Compose all three notes FIRST, before any tag ref can exist.
          # checker/release-notes.sh refuses when a tier's archive declares a
          # version that tier does not publish, or when the CHANGELOG section is
          # empty. A packet that cannot describe itself dies here, unpublished.
          for t in core lean unsealed; do
            bash checker/release-notes.sh "$t" "$RUNNER_TEMP/notes.$t.md"
          done

          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "${RELEASE_ASK:-}" != "release" ]; then
            echo "rehearsal only: the $BASE.x packet built above, and all three"
            echo "release notes composed and asserted. Publishing waits for an"
            echo "explicit dispatch with publish=release. Nothing uploaded."
            exit 0
          fi

          publish_one () {
            _tier=$1; _tag=$2; _zip=$3; _title=$4
            if gh release view "$_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "FAIL: release $_tag already exists -- a published release never moves"; exit 1
            fi
            # Existence judged by gh's EXIT CODE, never by output emptiness --
            # MEASURED 2026-08-17, run 32040024147 attempt 2: on a missing ref
            # `gh api` prints its 404 body to STDOUT, so the captured value read
            # {"message":"Not Found"...}, compared unequal to the SHA, and the
            # refusal fired at a tag that did not exist. It failed closed, but
            # it was aimed at a ghost.
            have=""
            have_type=""
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$_tag" --jq '.object.sha + " " + .object.type' > "$RUNNER_TEMP/tag-ref" 2>/dev/null; then
              have=$(cut -d' ' -f1 < "$RUNNER_TEMP/tag-ref")
              have_type=$(cut -d' ' -f2 < "$RUNNER_TEMP/tag-ref")
            fi
            # AN ANNOTATED TAG'S REF POINTS AT A TAG OBJECT, NOT AT THE COMMIT.
            # The comparison below used .object.sha directly, which equals the
            # commit only for LIGHTWEIGHT tags. The moment tags became annotated
            # (immediately below) that refusal would have fired on every correct
            # re-run, reporting "already points at <tag-object-sha>". Dereference
            # first, then compare commit to commit.
            _havecommit="$have"
            if [ "$have_type" = "tag" ] && [ -n "$have" ]; then
              _havecommit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$have" --jq '.object.sha' 2>/dev/null)
            fi
            if [ -n "$_havecommit" ] && [ "$_havecommit" != "$GITHUB_SHA" ]; then
              echo "FAIL: tag $_tag already points at $_havecommit, not at $GITHUB_SHA -- refusing to publish another commit under it"; exit 1
            fi
            if [ -z "$have" ]; then
              # ANNOTATED, NOT LIGHTWEIGHT -- AND THIS LINE IS WHY SIX TAGS ARE.
              # POSTing to git/refs with a COMMIT sha creates a lightweight tag:
              # a bare pointer with no tagger, no date and no message. MEASURED
              # 2026-08-22: all 41 tags through v5.0.2 are annotated, then
              # v6.0.0, v6.0.1, v6.0.2, v7.0.0, v8.0.0 and v8.0.1 -- every tag
              # this publisher has ever cut -- are lightweight, and
              # checker/release-consistency.sh has flagged the newest one ever
              # since. Create the TAG OBJECT first, then point the ref at it.
              _tagsha=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" \
                  -f tag="$_tag" -f message="$_title" -f object="$GITHUB_SHA" -f type=commit --jq '.sha')
              if [ -z "$_tagsha" ]; then
                echo "FAIL: could not create an annotated tag object for $_tag"; exit 1
              fi
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$_tag" -f sha="$_tagsha" >/dev/null
              # Read the landed tag back. A POST that returned 201 is not proof
              # the ref points at a tag object -- that is the assumption which
              # let six lightweight tags ship unnoticed.
              _ttype=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$_tag" --jq '.object.type' 2>/dev/null)
              if [ "$_ttype" != "tag" ]; then
                echo "FAIL: $_tag landed as '$_ttype', not an annotated tag object"; exit 1
              fi
              echo "tag $_tag cut ANNOTATED at $GITHUB_SHA -- the commit this very run just proved"
            else
              echo "tag $_tag already at $GITHUB_SHA -- adopting it"
            fi
            gh release create "$_tag" ".release/$_zip" .release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "$_title" --notes-file "$RUNNER_TEMP/notes.$_tier.md" --verify-tag
            # Count what landed. A publish that half-worked is a red run, not a
            # smaller success: one archive plus the shared checksum file.
            n=$(gh release view "$_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
            echo "assets on $_tag: $n"
            if [ "$n" -ne 2 ]; then
              echo "FAIL: expected 2 assets on $_tag, found $n"; exit 1
            fi
          }

          publish_one core     "v$BASE.0" RoT-MoE-Router.zip            "RoT MoE $BASE.0 -- Router"
          publish_one lean     "v$BASE.1" RoT-MoE-Router-Lean.zip       "RoT MoE $BASE.1 -- Lean"
          publish_one unsealed "v$BASE.2" RoT-MoE-Router-Lean-Extra.zip "RoT MoE $BASE.2 -- Lean+Extra"
          echo "published: v$BASE.0, v$BASE.1, v$BASE.2 -- one body, three archives, from the run that proved $GITHUB_SHA"
