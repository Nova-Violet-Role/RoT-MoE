# =============================================================================
# verify -- the WEEKLY VERDICT. Publishes STATUS.md; does not re-implement CI.
#
# WHAT CHANGED AND WHY. This workflow used to carry its own copy of every gate:
# its own elan install, its own lake build, its own leanchecker sweep, its own
# mutation run. That is two workflows asserting the same things, and the one
# that drifts is always the one nobody reads -- so a repo could sit green on a
# schedule while the real CI had been failing for a month, or vice versa.
#
# It now CALLS ci.yml (`workflow_call`). One definition of "verified", two
# triggers. If ci.yml gains a gate, this gains it in the same commit, with no
# chance of the two disagreeing.
#
# THE HONESTY RULE THIS FILE EXISTS TO ENFORCE, and it is the whole point of a
# scheduled run in a repo that also cares about discoverability:
#
#   `--allow-empty` is DELIBERATELY ABSENT below.
#
# A weekly job that commits regardless of outcome manufactures activity. It
# makes the repo look maintained without any evidence that it is, which is
# exactly the inauthentic-activity pattern R18 forbids. If the verdict did not
# change, NOTHING IS COMMITTED and the run is a no-op with a green tick. The
# commit is the signal; a commit that always happens carries no information.
# =============================================================================

name: verify

on:
  schedule:
    # Monday 06:00 UTC. One verdict per week is a claim; one per hour is noise.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write        # only to commit STATUS.md when the verdict CHANGES
  # `actions: read` is NOT for this workflow -- it is for the one it CALLS.
  #
  # MEASURED 2026-08-02: this workflow had NEVER run. Dispatched by hand, it
  # came back `startup_failure` with no jobs, no logs and no check run -- the
  # run is rejected before anything starts, so there is nothing to read.
  #
  # The cause: `jobs.gates` calls ./.github/workflows/ci.yml, and ci.yml
  # declares `permissions: contents: read, actions: read`. A CALLED workflow's
  # permissions may never exceed its CALLER's. This block granted `contents`
  # only, so the `actions: read` that ci.yml needs -- for
  # checker/deferred-closure.sh to read the previous run's log archive -- was
  # not grantable, and the whole run was refused at parse time.
  #
  # This would have failed silently every Monday at 06:00 UTC. It was never
  # noticed because a scheduled workflow that never starts produces no failure
  # notification and no red tick on any commit -- it simply does not appear.
  actions: read

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  # The gates themselves, defined once, in ci.yml.
  gates:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish the verdict
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # -------------------------------------------------------------------
      # THE VERDICT is generated by a script in the tree, NOT inline here, so
      # that it can be run and controlled locally without this runner:
      # `checker/verdict-stability.sh` holds it to determinism and sensitivity,
      # and `checker/workflow-lint.sh` holds THIS job to comparing the right
      # thing. A rule that lives only in a workflow is a rule nobody can test.
      # -------------------------------------------------------------------
      - name: Generate the verdict (measurements only -- no clock, no SHA)
        run: |
          set -e
          bash checker/status-verdict.sh > /tmp/verdict.new
          cat /tmp/verdict.new

      - name: Decide whether the VERDICT changed, not whether time passed
        id: decide
        run: |
          set -e
          # Extract the previous verdict from between the markers. Everything
          # outside them -- the timestamp, the commit id, the prose -- is
          # PROVENANCE and is deliberately excluded from the comparison.
          #
          # THE DEFECT THIS REPLACES (found 2026-08-01): the old step wrote
          # `date -u` and ${GITHUB_SHA} INTO the file it then compared, so
          # `git diff --staged --quiet` could never be true and the weekly job
          # would have committed every week regardless -- while the comment
          # directly above it explained that a bot committing regardless
          # manufactures activity and proves nothing. The rule was correct and
          # the payload defeated it.
          if [ -f STATUS.md ]; then
            awk '/<!-- VERDICT-BEGIN -->/{f=1;next} /<!-- VERDICT-END -->/{f=0} f' STATUS.md > /tmp/verdict.old
          else
            : > /tmp/verdict.old
          fi
          if diff -q /tmp/verdict.old /tmp/verdict.new >/dev/null 2>&1; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "verdict UNCHANGED -- nothing will be written or committed (this is the correct outcome)"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "verdict CHANGED:"
            diff -u /tmp/verdict.old /tmp/verdict.new || true
          fi

      - name: Write STATUS.md (only when the verdict changed)
        if: steps.decide.outputs.changed == 'yes'
        run: |
          {
            echo "<!-- SPDX-License-Identifier: AGPL-3.0-or-later OR EUPL-1.2 -->"
            echo "<!-- Copyright 2026 Saimonokuma. -->"
            echo
            echo "# STATUS"
            echo
            echo "Generated by \`.github/workflows/verify.yml\` from"
            echo "\`checker/status-verdict.sh\`. Every row is recounted from source by"
            echo "that script on the run that produced it -- none is a description."
            echo
            echo "<!-- VERDICT-BEGIN -->"
            cat /tmp/verdict.new
            echo "<!-- VERDICT-END -->"
            echo
            echo "Verified at $(date -u '+%Y-%m-%d %H:%M UTC') on commit"
            echo "\`${GITHUB_SHA}\`, all gates green -- see the \`CI\` run for that commit."
            echo "That line is PROVENANCE for the verdict above and is excluded from the"
            echo "comparison that decides whether to commit: a timestamp is evidence that"
            echo "time passed, never that anything was re-verified."
            echo
            echo "This file changes only when the measurements change. \`--allow-empty\`"
            echo "is deliberately absent below, and the step that writes this file does"
            echo "not run at all when the verdict is unchanged."
          } > STATUS.md
          cat STATUS.md

      # REPORT, DO NOT PUSH. Rewritten 2026-08-01, the same day the sibling
      # workflow's push was refused by the branch ruleset:
      #
      #   remote: - 4 of 4 required status checks are expected.
      #   ! [remote rejected] main -> main
      #
      # `main` now forbids deletion and force-push and requires four status
      # checks, and the GitHub Actions app cannot hold a repository-level
      # bypass (HTTP 422: "must be part of the ruleset source or owner
      # organization"). This step would have failed on its next Monday run.
      #
      # It is fixed by REMOVING the write, not by weakening the protection.
      # Nothing writes to main except a human. The verdict is published to the
      # run summary -- readable without a checkout -- and the job FAILS when
      # the committed STATUS.md no longer matches the measurements, so a stale
      # verdict is loud instead of silently repaired by a bot.
      #
      # The old rule ("commit only on real change, never --allow-empty")
      # survives intact in its stronger form: a commit still only happens on
      # real change, and now a PERSON makes it.
      - name: Publish the verdict, and FAIL if the committed one is stale
        if: steps.decide.outputs.changed == 'yes'
        run: |
          set -uo pipefail
          {
            echo "## The verdict CHANGED"
            echo
            echo 'STATUS.md in the tree no longer matches the measurements.'
            echo 'This job does not push to a protected branch -- regenerate and commit it:'
            echo
            echo '```sh'
            echo 'bash checker/status-verdict.sh'
            echo '```'
            echo
            echo '### measured now'
            echo '```'
            cat /tmp/verdict.new
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::STATUS.md is stale -- the verdict changed and no bot will commit it for you."
          diff -u /tmp/verdict.old /tmp/verdict.new || true
          exit 1
