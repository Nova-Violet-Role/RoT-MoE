# =============================================================================
# verify -- the WEEKLY VERDICT. Publishes STATUS.md; does not re-implement CI.
#
# WHAT CHANGED AND WHY. This workflow used to carry its own copy of every gate:
# its own elan install, its own lake build, its own leanchecker sweep, its own
# mutation run. That is two workflows asserting the same things, and the one
# that drifts is always the one nobody reads -- so a repo could sit green on a
# schedule while the real CI had been failing for a month, or vice versa.
#
# It now CALLS ci.yml (`workflow_call`). One definition of "verified", two
# triggers. If ci.yml gains a gate, this gains it in the same commit, with no
# chance of the two disagreeing.
#
# THE HONESTY RULE THIS FILE EXISTS TO ENFORCE, and it is the whole point of a
# scheduled run in a repo that also cares about discoverability:
#
#   `--allow-empty` is DELIBERATELY ABSENT below.
#
# A weekly job that commits regardless of outcome manufactures activity. It
# makes the repo look maintained without any evidence that it is, which is
# exactly the inauthentic-activity pattern R18 forbids. If the verdict did not
# change, NOTHING IS COMMITTED and the run is a no-op with a green tick. The
# commit is the signal; a commit that always happens carries no information.
# =============================================================================

name: verify

on:
  schedule:
    # Monday 06:00 UTC. One verdict per week is a claim; one per hour is noise.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write        # only to commit STATUS.md when the verdict CHANGES

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  # The gates themselves, defined once, in ci.yml.
  gates:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish the verdict
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count what is actually there (never from memory)
        id: counts
        run: |
          set -e
          # Recounted from source on every run. A number typed by hand in a
          # README is a claim; a number recounted here is a measurement, and
          # ads-manager.yml fails the build when the two disagree.
          TH=$(grep -hcE '^(@\[[^]]*\] )?(private |protected |noncomputable )*(theorem|lemma) ' \
                 lean/Proofs/*.lean | awk '{s+=$1} END{print s+0}')
          MOD=$(ls lean/Proofs/*.lean | wc -l)
          MUT=$(ls lean/mutate/mutate_*.sh | wc -l)
          echo "theorems=$TH" >> "$GITHUB_OUTPUT"
          echo "modules=$MOD" >> "$GITHUB_OUTPUT"
          echo "suites=$MUT"  >> "$GITHUB_OUTPUT"
          echo "counted: $TH theorems in $MOD modules, $MUT mutation suites"

      - name: Write STATUS.md
        run: |
          {
            echo "<!-- SPDX-License-Identifier: AGPL-3.0-or-later OR EUPL-1.2 -->"
            echo "<!-- Copyright 2026 Saimonokuma. -->"
            echo
            echo "# STATUS"
            echo
            echo "Generated by \`.github/workflows/verify.yml\`. Every line below is a"
            echo "measurement from the run that produced it, not a description."
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| verified at | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| toolchain | \`$(cat lean/lean-toolchain)\` |"
            echo "| theorems | ${{ steps.counts.outputs.theorems }} |"
            echo "| modules | ${{ steps.counts.outputs.modules }} |"
            echo "| mutation suites | ${{ steps.counts.outputs.suites }} |"
            echo "| gates | all green (see the \`CI\` run for this commit) |"
            echo
            echo "\`sorry\`: none. \`native_decide\`: none. Both are enforced by CI"
            echo "steps that fail the build, not by convention."
            echo
            echo "This file changes only when the verdict changes. A weekly commit"
            echo "that always happens would manufacture activity and prove nothing;"
            echo "\`--allow-empty\` is deliberately absent from the commit below."
          } > STATUS.md
          cat STATUS.md

      - name: Commit ONLY if the verdict changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          # --allow-empty is DELIBERATELY ABSENT. No change, no commit.
          if git diff --staged --quiet; then
            echo "verdict unchanged -- NOTHING COMMITTED (this is the correct outcome)"
          else
            git commit -m "ci: re-verified against $(cat lean/lean-toolchain)"
            git push
            echo "verdict CHANGED -- committed"
          fi
